specialist_reviews:
  - claim: "the prediction floor (a logarithmic practice effect planted on each corpus's structure, read against
      null twins) is a valid detection floor for a model's ability to carry a practice effect into its predictions"
    role: psychometrician or knowledge-tracing methodologist
    status: requested
  - claim: "the pyKT gate (pyKT's own loop against the published value, then the benchmark loop against pyKT's
      loop on one fold) establishes that the deep implementations are faithful"
    role: deep knowledge-tracing practitioner
    status: requested

