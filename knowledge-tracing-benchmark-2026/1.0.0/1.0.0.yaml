schema_version: 1

release:
  id: knowledge-tracing-benchmark-2026
  version: 1.0.0
  title: >-
    Published knowledge-tracing models under one protocol on three tutor corpora
  released_at: 2026-11-20
  # The QUESTION, not the finding.
  question: >-
    Under one protocol (the same learner-level folds, test rows and scorer) on
    two KDD Cup 2010 Cognitive Tutor logs and EDM Cup 2023, do thirteen
    published knowledge-tracing models and baselines reproduce the published
    numbers they are gated on, can the benchmark detect a planted practice
    effect through each, how well does each predict the next answer, and how
    does each change as training learners and training histories thin?

protocol:
  ref: knowledge-tracing-tutor-logs
  version: 1.0.0

no_study_reason: >-
  No study plan object of the learning-wiki schema was written. The benchmark
  was registered on 11 Nov 2026, before any counted run (its design, pass
  rules and verdict strings), and four amendments were written while it ran,
  from 11 to 15 Nov 2026. Neither the registration nor the amendments is
  published yet, because they also govern models this release does not report
  (their SHA-256 fingerprints are in design.preregistration.note, and their
  full text follows when those models are reported);
  the article's section 4 states every rule this release applies and section
  4.7 the departures from them. The registration also names comparison readings between
  pairs of models that no job computed in this pass; they are not reported.

research_design:
  family: other
  detail: >-
    Benchmark of predictive models on secondary data. Five learner-level folds
    per corpus, identical test rows for every model, one scorer (AUC, log loss,
    saturated share on all scored rows). Before a model's numbers count: a gate
    (reproduce a published AUC within a fixed band) and a prediction floor
    (recover at least half of a practice effect planted in synthetic worlds
    built on the corpus's structure, against null twins). Regimes: 100%, 25%,
    10% and 2% of the training learners (10% and 2% drawn five times, nested),
    and training histories cut to 50 and 20 answers. Descriptive comparison
    only: no paired interval between models was computed.
  preregistration:
    registered: false
    note: >-
      Not registered with an outside registry, and not published. The design,
      the gates, the floor and its pass rule, the regimes and the verdict
      strings were registered on 11 Nov 2026, before any counted run. Four
      amendments were written while the benchmark ran: Amendment 1 (11-12 Nov;
      PFA's gate target, and the pyKT gate, which the registration had left
      unbuilt), Amendment 2 (12-13 Nov; LPKT added), Amendment 3 (13-15 Nov;
      the rented-machine layout, and the recorded deviations that moved some
      fits to GPUs, where the registration pinned CPUs) and Amendment 4 (13-15
      Nov; HawkesKT built as pyKT sets it up, in force for HawkesKT from 13
      Nov). Amendments 1 to 3 were drafts while the fits ran; the author
      confirmed on 20 Nov 2026 that they are the amendments the benchmark ran
      under. The floors of PFA, BKT and the running proportion were added on
      16 Nov 2026, outside the registered stage lists, and are reported as
      descriptive only (maintainer, 21 Nov 2026). LPKT's architecture was
      tuned on its gate's split after a first failed gate. These documents
      name models this release does not report, so they are not published
      with it yet (maintainer, 21 Nov 2026): their full text is published when
      those models are reported, and their SHA-256 fingerprints are given now so
      that a reader can check later that the text is unchanged: the registration (last changed 11 November 2026) 331b664230767f3947de0c50acf65c89297874a311fdf6aed0a198a0fafca455; Amendment 1 (last changed 12 November 2026) c57c73d75f698796d8aae18260d73ef6e01f92355ed6442c15549c3fa01669e8; Amendment 2 (last changed 13 November 2026) e531aa1fa48eebc61c68747ece649b0b2553519784e026be6321b4d3a280d659; Amendment 3 (last changed 15 November 2026) e36ac0d54c7dc726c9292a54c34fff77599e971b50bfce6a9888bd158d3ca5ed; Amendment 4 (last changed 15 November 2026) 2383263a446efe298a6cd97f9e52e30272ffae2f8e795dc2ac7161b4c501a8a4.

