interpretation: >-
  All nine gated models reproduced their published targets within the
  registered band (PFA against Gervet et al.'s Table 13 value after an
  amendment; HawkesKT and LPKT after changes made in response to a first
  failure). The benchmark recovered a planted practice effect through five of
  the six models given the floor (the deep models) at 25% of the training
  learners; through HawkesKT it did not on either KDD corpus, so those numbers
  are not read. The floors run for PFA, BKT and the running proportion outside
  the registered stage lists are reported as descriptive only. With
  all training learners, AKT and then simpleKT had the highest mean test AUC on
  all three corpora (0.8148 and 0.8128 on half A, 0.8149 and 0.8148 on
  bridge06, 0.8381 and 0.8364 on EDM Cup), by margins inside the fold ranges;
  on EDM Cup their order and IEKT's is device-sensitive under the registered
  rule, and on half A so is their lead (and that of Best-LR with time
  windows, the model identifier Best-LR+) over IEKT, whose fits
  there ran on a GPU. With 2% of the training learners, on the two KDD
  corpora, the recurrent deep models (DKT, IEKT, LPKT) lost more AUC than the
  logistic models, the attention models about as much as the Best-LR models,
  and, of the models that fit anything, BKT least on every corpus; most of
  these 2% numbers have no floor at that size. With training histories cut
  to 20 answers the logistic models lost more than the attention models and
  BKT on the KDD corpora; the logistic models' and BKT's numbers are
  descriptive only. No difference between two models was tested.

limitations:
  - >-
    No paired interval between models: per-row predictions were not kept, so
    every comparison is descriptive.
  - >-
    All rows were scored, including rows after help; the unassisted and
    first-attempt row sets the registration names were not scored.
  - >-
    No floor was run for the three Best-LR models, for PFA, BKT and the running
    proportion on EDM Cup, or at 2% on bridge06; those numbers are descriptive
    under the registered rule. The floors of PFA, BKT and the running
    proportion on the KDD corpora were added after the registered fits, outside
    the registered stage lists, and are reported as descriptive only, so those
    three models' numbers are descriptive as well.
  - >-
    Registered reports not made: the share of deep fits stopping at the 20-epoch
    cap (and the rule that a model capped on more than half its folds is a
    floor, not a result), because the committed aggregates do not record the
    stopping epoch; EDM Cup's sensitivity run without its out-of-order problem
    logs, which needs new fits; the strata and the unassisted and
    first-attempt row sets, which need per-row predictions; and the t interval
    beside each floor interval, which needs each twin pair's statistic.
  - >-
    PFA's gate rests on reading Gervet et al.'s Table 4 value as a misprint of
    Table 13's, a reading that an earlier published value on the same corpus
    (Choffin et al., 2019, Table 4: 0.739, which agrees with Table 4) weighs
    against; LPKT's gate followed tuning on the gate's own split.
  - >-
    The deep models' configurations come from small grids. Some fits ran on
    GPUs, against the registration's CPU-only pin; the pre-registered device
    bands (largest GPU-CPU AUC difference over a sample of fits) are 0.0169
    for IEKT, 0.0035 for AKT, 0.0021 for simpleKT and 0.0003 for LPKT, and a
    comparison within twice a model's band is device-sensitive, which includes
    the EDM Cup order of AKT, simpleKT and IEKT and the lead of AKT, simpleKT
    and Best-LR with time windows over IEKT on half A. The samples are not all from the
    corpora of the counted GPU fits: IEKT's are bridge06 fits (its GPU fits
    are on half A and EDM Cup), AKT's and simpleKT's are half A and bridge06
    fits (their GPU fits are on EDM Cup).
  - >-
    Three spent corpora from two tutoring platforms; LPKT was not fitted on
    EDM Cup.
  - >-
    The benchmark's fitting harness is not published, so the fits cannot be
    rerun from the package; every printed number can be recomputed from the
    per-case outputs.

