      Secondary analysis of de-identified, published tutor logs; no contact,
      no intervention, no re-identification. See the protocol.
  data_sharing:
    permitted: false
    detail: >-
      DataShop's terms and the ASSISTments Data Terms of Use do not permit
      redistribution. The release records each file's location and hash and
      publishes per-fold aggregates only. Every outcome on EDM Cup 2023 reported
      here is public, as its terms require. Acknowledgment: ASSISTments; EDM Cup
      2023, doi 10.17605/OSF.IO/YRWUH; KDD Cup 2010 data from the PSLC DataShop
      (Stamper et al., 2010).

