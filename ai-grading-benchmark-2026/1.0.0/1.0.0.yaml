analyses:
  - id: board-fetch
    title: Fetch and hash-check the board's corpora and build the pinned cases files
    prespecified: true
    rerun: offline
    code: {repo: "https://github.com/Learning-Design-Alliance/ai-grading-benchmark", commit: bd3165f3d5bd1cd68c0a3f6115dbb2e3719b8107, path: fetch_data.py}
    environment:
      kind: process
      detail: >-
        Python 3.11 or later with pyarrow. `python3 fetch_data.py --dir DATA` downloads the four sources,
        checks each against its pinned sha256 and each built cases file against leaderboard-cases.json.
    invocation: ["python3 fetch_data.py --dir DATA"]
    inputs: [mohler-asag, harmogen-r, asap2, vtg]
    ai_processing: false
    results: ["4.2 (data)"]

  - id: board
    title: >-
      The board: agreement, decision agreement, probes and flags per model and task, from the committed grades
    prespecified: true
    rerun: offline
    code: {repo: "https://github.com/Learning-Design-Alliance/ai-grading-benchmark", commit: bd3165f3d5bd1cd68c0a3f6115dbb2e3719b8107, path: leaderboard.py}
    environment:
      kind: process
      detail: >-
        Python 3.11 or later, standard library. Reads submissions/ (the grades each model gave, exported from its
        runs by `leaderboard.py export`) and the cases files built by board-fetch; bootstrap intervals with a fixed
        seed. The grading calls themselves were made with bench.py through OpenRouter with zero data retention except Claude Fable 5.1 (the maintainers' own Anthropic key through OpenRouter, 30-day safety retention, public corpora only),
        or self-hosted on vLLM for Olmo 3.1 32B; their replies are not published.
    invocation:
      - "python3 leaderboard.py build submissions/ --cases-dir DATA            # writes out/leaderboard.json"
      - "python3 leaderboard.py overall out/leaderboard.json --feedback feedback-board/out/feedback-board.json --discordant feedback-discordant/out/discordant.json --extra essays-genft/out/board_rows.json --out out/overall.json"
      - "python3 leaderboard.py scoring out/leaderboard.json --extra out/baselines.json out/finetune_extra.json essays-genft/out/board_rows.json   # writes out/scoring.json"
    committed_outputs: [out/leaderboard.json, out/public/leaderboard.json, out/overall.json, out/scoring.json]
    note: >-
      out/leaderboard.json is committed as the file the paper's report read. It was built on 2026-10-26 by earlier
      code (its code_sha256 is 33d6241e…; the pinned code's is 7cb20201…). A rebuild at the pinned commit matches it on
      every result field and differs only in its build time and that code hash, which reproduce.py leaves out of the
      comparison.
    inputs: [mohler-asag, harmogen-r, asap2, benchmark-outputs]
    ai_processing: true
    results: ["5.1 (Table 5.1)", "5.2 (Table 5.2, flags)", "model-table order throughout"]

  - id: standard-checks
    title: The three standard checks of automated scoring, and the progressive and regressive split of pushback
    prespecified: true
    rerun: offline
    code: {repo: "https://github.com/Learning-Design-Alliance/ai-grading-benchmark", commit: bd3165f3d5bd1cd68c0a3f6115dbb2e3719b8107, path: analyses/standard_checks.py}
    environment: {kind: process, detail: "Python 3.11 or later, standard library; reads submissions/ and DATA. The thresholds are the field's, fixed before any submission was read; neither the checks nor the pushback split was checked on simulated graders."}
    invocation: ["python3 analyses/standard_checks.py --cases-dir DATA --out out/standard_checks.json"]
    committed_outputs: [out/standard_checks.json]
    inputs: [mohler-asag, harmogen-r, asap2, benchmark-outputs]
    ai_processing: true
    results: ["5.1 (standardized mean difference)", "5.3 (pushback split)"]

  - id: length-partial
    title: Length beside agreement on the board's tasks, and a length-only scorer
    prespecified: true
    rerun: offline
    code: {repo: "https://github.com/Learning-Design-Alliance/ai-grading-benchmark", commit: bd3165f3d5bd1cd68c0a3f6115dbb2e3719b8107, path: analyses/length_partial.py}
    environment: {kind: process, detail: "Python 3.11 or later, standard library; reads submissions/ and DATA."}
    invocation: ["python3 analyses/length_partial.py --cases-dir DATA --out out/length_partial.json"]
    committed_outputs: [out/length_partial.json]
    inputs: [mohler-asag, harmogen-r, asap2, benchmark-outputs]
    ai_processing: true
    results: ["5.1"]

  - id: trained-scorers
    title: Trained scorers on the board's tasks, the CPU ones (length only, word features, reference similarity, sentence embeddings)
    prespecified: true
    rerun: offline
    code: {repo: "https://github.com/Learning-Design-Alliance/ai-grading-benchmark", commit: bd3165f3d5bd1cd68c0a3f6115dbb2e3719b8107, path: baselines/baselines.py}
    environment:
      kind: process
      detail: >-
        Python 3.11 or later with scikit-learn and sentence-transformers (all-MiniLM-L6-v2 at the revision the
        script pins). `--kinds` recomputes these rows and keeps the DeBERTa rows already in out/baselines.json; it
        writes the CPU rows after them, so the row order changes and the comparison is row by row.
    invocation: ["python3 baselines/baselines.py --cases-dir DATA --out out/baselines.json --kinds length tfidf-ridge reference-similarity encoder-ridge"]
    committed_outputs: [out/baselines.json]
    inputs: [mohler-asag, harmogen-r, asap2]
    ai_processing: true
    results: ["5.1 (trained scorers)"]

  - id: trained-scorers-deberta
    title: The DeBERTa-v3 trained scorer on the board's tasks
    prespecified: true
    rerun: gpu
    code: {repo: "https://github.com/Learning-Design-Alliance/ai-grading-benchmark", commit: bd3165f3d5bd1cd68c0a3f6115dbb2e3719b8107, path: baselines/baselines.py}
    environment:
      kind: process
      detail: >-
        transformers and one GPU (trained on a rented GPU with gpu/pod.py); microsoft/deberta-v3-base at the revision,
        schedule and seed the script's docstring gives. Run without `--kinds`, the script trains every scorer,
        DeBERTa included, and so needs the GPU.
    invocation: ["python3 baselines/baselines.py --cases-dir DATA --out out/baselines.json --kinds deberta-ft"]
    committed_outputs: [out/baselines.json]
    inputs: [mohler-asag, harmogen-r, asap2]
    ai_processing: true
    results: ["5.1 (the fine-tuned scorer, QWK 0.809 on essays)"]

  - id: essays-finetune
    title: Grade-only essay fine-tunes (DeBERTa-v3, Qwen3 4B and Gemma 4 26B A4B regression heads) against prompted models
    prespecified: true
    rerun: gpu
    code: {repo: "https://github.com/Learning-Design-Alliance/ai-grading-benchmark", commit: bd3165f3d5bd1cd68c0a3f6115dbb2e3719b8107, path: essays-finetune/study.py}
    environment:
      kind: process
      detail: >-
        Training on one rented A100 80GB (essays-finetune/train.py; recipe and seeds in the docstring); the
        prompted arms through OpenRouter with zero data retention. The split is committed (out/split.json); the
