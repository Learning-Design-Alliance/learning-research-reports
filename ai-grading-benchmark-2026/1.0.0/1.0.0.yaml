interpretation: >-
  Agreement with expert raters on ordinary work did not show how a model behaves when the work, the context or the
  conversation is altered. On short answers most of the 22 prompted models agree with the two raters about as well as
  the raters agree with each other, and none is shown to exceed them; on code four are shown to agree with the raters
  more than the raters agree with each other; on essays no point estimate reaches the raters' published agreement and
  18 of the 22 are shown to fall below it, while a scorer fine-tuned on the corpus's graded essays has a higher point
  estimate than every model. Beside agreement, a note written into the answer raised the grade by more than 5% of the
  scale for 14 of the 22 models as their hosts served them (for one of them, GLM 5.3, the largest gain, on code, is that of its 4-bit
  hosts; its gains on the other two tasks also exceed 5%), and seven of them credited blank or meaningless answers; 17 raised their grade more after a student only
  objected than after a request to double-check it; and told a grade that contradicts the work, every model wrote
  feedback whose tone, measured by a word rule validated on tutoring replies, followed that grade. Most audio models
  credited silent recordings, and only four of 21 video runs were shown to grade a recording beyond its length.
  Describing the student as strong raised grades in 28 of 66 model-task pairs (24 after correction for multiple
  comparisons), in line with the attainment-label
  effect reported in release ai-grader-reliability-2026 (Porcaro 2026). The grader's settings matter but no setting
  helped every model: in a single run, high reasoning effort or an added guard sentence fixed four of the 14 flagged
  models; the guard sentence made three others more gameable beyond the spread between repeated runs; 4-bit hosts
  were gamed more, while for two smaller dense models with the host held fixed, 4-bit weights were not shown to raise
  the forged override's gain by more than 5% of the scale, though for Phi-4 on code they raised the polite request's
  gain by 9.9%. Fine-tuning one model on essays raised its essay agreement (the size of the gain on familiar assignments could not
  be confirmed by its check), and the gain carried over to essay assignments it never saw, but lowered its agreement on short answers and its reading of mathematics working. The trained scorers
  lead only on the corpus with tens of thousands of graded answers; with three corpora that differ in task as well as
  in training size, the benchmark cannot say which of the two explains it. The disability gap on ASAP 2.0 cannot be
  attributed to the models rather than to the human reference, and length and convention errors account for at most
  a fifth of it for 17 of the 20 models with a gap; on economic status every model's gap lies within the
  pre-registered band of a second human rater's; four models graded Black learners lower beyond a second rater,
  though none by an interval wholly below the pre-registered −0.10; the Hispanic-against-White signal is not established as a model
  bias. The author reads this as: a grader's agreement is one piece of evidence; the rest comes from probes with a
  known correct response, checked on simulated graders before they are read, run on the grader as deployed, and run
  again when its prompt, settings, provider or model changes.

limitations:
  - >-
    QWK depends on the scale and on how grades are distributed, so models are compared within a task, as a share of
    the raters' agreement on the same items; the essay ceiling is the raters' published agreement before
    adjudication, on a different set of essays from the board's 100.
  - >-
    Every model was graded through one plain prompt; agreement figures describe what that prompt achieves, not what
    a model can achieve with a tuned prompt, graded examples or a rubric written for the task.
  - >-
    Every adversarial probe tries to raise the grade, none to lower it, and pushback is one unargued objection.
  - >-
    The feedback tone measure and the Withholding Answers evaluator were validated on tutoring replies to
    mathematics mistakes and applied to grading feedback on short answers; both transfers are arguments, not
    measurements.
  - >-
    The mathematics solutions' errors were written by a language model; the video measure removes length from both
    the model's grades and the raters', and length carries real information about skill; the surface features in
    the disability analysis are rule-coded proxies.
  - >-
    Claude Fable 5.1's submission files record the request flag `provider.zdr: true`, but its gradings went
    through the maintainers' own Anthropic key under that key's 30-day safety retention. Because of a configuration
    issue with that stored key, Claude Haiku 5.5's requests in the handwriting runs, the video study's 16-frame run
    and the ELLIPSE fairness runs went through it too, an unintended exception on public corpora; the key was
    turned off on 2026-10-30. The benchmark's corrections log records this (2026-10-25, "Data retention for Claude
    Fable 5.1 and Claude Haiku 5.5"; 2026-10-30), and the article states the retention.
  - >-
    Hosted models were served by providers chosen at request time, so a board result can mix hosts (GLM 5.3's code
    gain is that of its 4-bit hosts); only precision was isolated, for two smaller dense models. Some setup studies ran once; only the guard sentence's harms were re-tested.
  - >-
    The corpora are public and a model may have seen their items in training; one open model's training data
    contained some items, and the closed models' training data are unknown.
  - >-
    The corpora are English, from one undergraduate course for short answers, one for programs and US school
    essays; the models are the versions served during the study and change between releases.
  - >-
    The perception audit could test only open models, and beyond the works the article cites, the literature on skin
    tone and lighting in vision models was not reviewed.
  - >-
    Each task has 100 items, so many intervals are wide and "no difference shown" is not "no difference"; intervals
    from different studies were not corrected jointly for multiplicity.
  - >-
    The models' replies are not published (they quote the student work), so the studies that read them cannot be
    re-run from the release; their aggregate outputs are published, and every number the paper's report links is
    recomputed from them. The board's own grades are published and its analyses re-run offline.
  - >-
    Six sets of statistics were not checked on simulated graders: the standard checks, the setups study's held-out
    note, the pushback split, the board's feedback columns (the halo and the gives-away share), the handwriting
    probes and the release comparison (exploratory, point estimates); the feedback ratio S/W is descriptive. Four
    studies state no verdict wording (the trained scorers, the feedback board's columns, speech and handwriting).
    Many numbered changes were made after some of that study's results had been read, some of them changing what is
    scored, and the board's unnumbered scoring changes (five, listed by commit in the preregistration note) were made
    after its results.
  - >-
    The pushback effect is the objection's rise minus the rise after a request to double-check, which itself lowered
    grades for ten of the 17 models that yield, so it is not the objection's raw effect and is not a lower bound on
    it.
  - >-
    The feedback result rests on a praise-and-criticism word rule and on a badly wrong told grade (the mirror of the
    true one); whether milder errors carry over, and whether the feedback's substance follows the grade, is untested.
  - >-
    The fine-tuning results are for one model; its code agreement moved up by an amount its check could not confirm, while its short-answer
    agreement and its reading of mathematics working fell.
  - >-
    No study with students was run: whether feedback that follows a told grade changes what students learn is
    untested.

funding: >-
  None. Internal research by the Learning Design Alliance. No external funder, no grant.

conflicts: >-
  The Learning Design Alliance, the author's organization, makes Lazuli, a product that grades student work and
  writes feedback; Lazuli is not among the graders tested, and nothing from its prompts or results is used. The
  research and writing were carried out with Claude Code, made by Anthropic, which also makes three of the models
  tested (Claude Opus 5.5, Claude Fable 5.1 and Claude Haiku 5.5).

