# Release record for the AI grading benchmark paper (research/article/ai-grading-benchmark.md).
# Filled 2026-10-28 from the finished draft: datasets (location, license, sha256), analyses (the benchmark
# repository at one pinned commit, the maintainer's decision of 2026-10-26: the code is the benchmark's public
# repository at a pinned commit, not a copied package; each analysis's exact invocation; whether it re-runs
# offline), interpretation and limitations from the article. `evidence:` waits for the observation records.
# Nothing has been released, so this file stays at 1.0.0 and is corrected in place until its DOI is published.
schema_version: 1

release:
  id: ai-grading-benchmark-2026
  version: 1.0.0
  title: >-
    Beyond agreement: a benchmark of how language models grade student work, and how they fail
  # The QUESTION, not the finding.
  question: >-
    How closely do prompted language models agree with expert raters on student work, against the raters'
    own agreement and against trained scorers; can a student move a model's grade without improving the
    work, and do the grader's settings change that; does a model hold its grade under pushback, read the
    working and write feedback independent of a grade it was told; do speech, handwriting and video graders
    grade the recording itself; do models grade groups of students differently, or change between releases;
    and what does a grading cost in energy, carbon and water?
  # The date of this draft. Set to the date of the lift when the release is published.
  released_at: 2026-10-28

research_design:
  family: other
  detail: >-
    A benchmark: fixed public corpora with expert grades, graded by prompted language models through one
    plain prompt, under zero data retention for every model but one (Claude Fable 5.1, run only on public
    corpora under its maker's 30-day retention), and probed with altered versions of the same work whose sound
    response is known in advance. Every probe and every study verdict, except the six sets of statistics named in
    the preregistration note, was checked on simulated graders with planted effects. Each study is pre-registered,
    in its script or a PREREG.md file, with its later changes numbered and their reasons given; many of them were
    made after some of that study's results had been read (the preregistration note says of what kinds), and the
    board's unnumbered scoring changes are listed by commit in the preregistration note.
  preregistration:
    registered: true
    note: >-
      Per study (30 studies; the comparison of releases is exploratory and has none): each study opens with its
      pre-registration, in its script's docstring or, for speech, handwriting and video, in a PREREG.md file,
      committed before any result of its design was read (for the studies that reanalyse existing runs, before
      the script read them), and numbers its later changes with their reasons. The speech, handwriting and
      video pre-registrations followed a smoke run of two cases or three gradings, which is not part of a result;
      perception's was written first, and its design was changed after a one-model pilot (its CHANGE 1), before any
      call of the design it ran. Every study states a threshold and verdict wording in advance except four, which
      state what they report but no verdict: the trained scorers (baselines/baselines.py, expectations), the
      feedback board's columns (feedback-board/fb.py), speech and handwriting (their PREREG.md: probes and what a
      sound grader does). The board stated its probe battery and detection thresholds in advance; its
      disqualifying flags were added after its first rows (d04c148f, below). Many numbered changes, in most studies, were made after some of that study's results had
      been read. The largest group only added models or graders (the maintainer's decisions on coverage, with no
      rule changed); others added an arm or run, fixed a bug, added a reported statistic, or changed what is scored
      or how a measure is read (for example feedback-board/fb.py CHANGE 1, which left the gives-away share out of
      the feedback strand's score after the results). The board's own scoring also changed after its results
      without a numbered change, each in the repository's commit history: the whole-task score, its strand
      weights and rank intervals, and the disqualifying flags with the rule that a flagged model ranks below every
      unflagged one (2026-10-24, d04c148f); the reading-the-working and pushback strands added to it (2026-10-25,
      bef2041b); the false-discovery correction and per-task scores (2026-10-25, 09ef6229; also dated in
      leaderboard.py's docstring); and the feedback strand twice (2026-10-27: the halo scored by its distance from 0,
      c23ba3aa, then replaced by the wrong-grade test, 60a885c8; both also rows in docs/CORRECTIONS.md). The board's
      battery was fixed in leaderboard.py before the board's rows were built. Six sets of
      statistics were not checked on simulated graders (the article's Section 4.6): the standard checks of
      automated scoring, the setups study's held-out note (a condition of its FIXED verdict), the progressive and
      regressive split of pushback, the board's feedback columns (halo and gives-away share), the handwriting
      probes, and the comparison between model releases (exploratory, point estimates); the feedback study's ratio
      S/W is descriptive, with no interval, and the video verdict's check is three planted graders, one simulated
      dataset each. The inventory, with each study's pre-registration, check and classified changes and the board's
      unnumbered changes, is preregistration-inventory.md beside this file (artifact `preregistration-inventory`).

no_protocol_reason: >-
  A secondary analysis of public, de-identified corpora released by others under open licenses (and one
  corpus under a limited evaluation license, Casual Conversations v2). No data were collected from people for
  this work, so no data-collection protocol of the Learning Design Alliance governs it; each corpus's own
  license is recorded under `datasets:`.

no_study_reason: >-
  No study plan object was written in this wiki. Each analysis below is a study in the benchmark repository whose
  pre-registration (in its script's docstring, or for speech, handwriting and video in a PREREG.md file) states its
  question and statistic, its threshold and verdict wording where it has them (every study but the trained
  scorers, the feedback board's columns, speech and handwriting), and its planted-effect check where Section 4.6 of
  the article says it has one; it was committed before any result of its design was read, and its later changes are
  numbered in the same file. The board's battery was fixed in leaderboard.py before the board's rows were built; its
  unnumbered scoring changes are listed by commit in the preregistration note. `prespecified` says which.

# THE CODE. Every analysis's code is the AI grading benchmark repository at one commit (the maintainer's
# decision, 2026-10-26: the code is the benchmark's public repository at a pinned commit, not a copied package).
# Paths are relative to that repository; the paper writes them `code/<path>`. The repository is private until
# the maintainer makes it public; it is to be public at this commit before the release is lifted.
#
# WHAT CAN BE RE-RUN FROM THIS RECORD. `rerun:` on each analysis says:
#   offline   no model call: run with the commands given, on the corpora listed (fetched and hash-checked),
#             and the committed outputs; reproduce.py beside this file runs these and compares byte for byte.
#   api       the grading calls go to hosted models (zero data retention, with the exceptions in each entry); the replies are not published
#             (they quote the student work), so the analysis step cannot be re-run from the release. Its
#             committed out/ files are what the paper's numbers are computed from, and the report recomputes
#             every linked number from them.
#   gpu       as api, but the model was served on a rented GPU (vLLM); the serving recipe is in the script.
# The models' grades on the board's items ARE published (submissions/, grades only), which is why the board,
# its standard checks and its length analysis re-run offline.

