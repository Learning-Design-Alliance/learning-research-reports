name: check releases

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every release lifted, listed and unaltered
        if: github.event_name == 'push'
        run: python3 scripts/check_releases.py
      - name: Every release lifted, listed and unaltered; no published version changed
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_releases.py --base "origin/${{ github.base_ref }}"
