  # Every re-test number is regenerated from this file by a declared analysis
  # (rebuild the analysis-ready dumps with strip_dumps.py, below). Published
  # beside this release file by maintainer decision, 2026-10-06.
  - id: per-case-model-outputs
    title: >-
      Per-case outputs of every re-test model run, stripped: for each graded
      case its corpus id, learner or essay id, the label or exemplar marks
      shown, the human score and the model's mark in each arm
    grain: one graded case under every arm of one model run
    format: ndjson
    # `git`: the file ships in the same repository as this release file, beside
    # it, so the ref is its repository-relative path (it resolves in
    # learning-wiki once the release is transplanted, and in the research
    # repository under research/wiki/ until then). The hash pins the bytes.
    location:
      kind: git
      ref: research/releases/ai-grader-reliability-2026/per-case-model-outputs.jsonl
    sha256: 4b0bd3e8fa0d771d9a1eb4efab68ff423460c2f0a3a5ad5d88d0c5330586346d
    # Case lines. The file also opens with 32 run lines (one per model run),
    # 14,292 lines in all.
    rows: 14260
    size_bytes: 4246544
    identifiability: deidentified
    access: published
    derived_from:
      - jorgpt-answers
      - mohler-consistent
      - menagerie-grades
      - asap2
    note: >-
      JSON Lines; data dictionary in per-case-model-outputs.README.md beside
      it. Generated by studies/measurement/grader-eval/analyses/strip_dumps.py
      (research repository, committed 2026-10-06 with this record) from the
      32 per-case harness dumps of the runs: grader-vi/ (swapped label on four
      models, attempt history, pooling), breadth/ (Opus 5.5, Llama 4, the
      reasoning arms and the Gemini re-run), exmarks/,
      grader-label-stability/, grader-vi-groups/ and reproduction-rerun/ (the
      independent reproduction's Gemini attempt-history spot re-run of 2026-10-06), fable-agent/ (Fable 5.1 graded as Claude Code subagents, 2026-10-06) and neutral/ (the size-matched neutral-statement run on Gemini, 2026-10-06). The script checks each dump against
      studies/measurement/grader-eval/analyses/per-case-dumps.sha256 before
      reading it, and each run line names its source dump and hash. KEPT:
      corpus, case id, learner or essay id as the corpus publishes it, label
      or exemplar marks shown, human score, model id, the model's marks, and
      the harness's numeric bookkeeping (tail, scale, lengths in characters).
      LEFT OUT: ASAP 2.0's demographic fields and the sampling cell derived
      from them, which re-join from the public corpus by essay id
      (`strip_dumps.py rebuild --asap2`), and one local file path. The dumps
      never held answer, program or essay text or grader rationales, and the
      script refuses any long string. The full dumps are kept privately,
      with the hashes above. `strip_dumps.py verify` shows the rebuilt dumps
      equal the originals in every row and header field but that path, and
      every marks-only analysis below regenerated its committed out/*.json byte for byte from the rebuilt dumps (records-1.md). Since corrections-5 the rebuilt dumps are written as the harness wrote them (indent 2, no trailing newline), so 30 of the 32 are byte-identical to the originals and match per-case-dumps.sha256 (the two ASAP 2.0 files lose `resumedFrom`; their rebuilt hashes, which are deterministic, are listed in per-case-dumps.rebuilt.sha256 and accepted by label-dose and by `strip_dumps.py verify`); `ceiling-robustness`, which checks each dump's hash, was re-run from them to its committed outputs (selftest, floor, results and posthoc, byte for byte). The original
      single runs (Table 5.1, the first history run, the original attainment
      contrast, the original exemplar table, grader against each Mohler
      rater) left no per-case output, and this file does not replace them.

analyses:
  # SPLIT PER CORPUS, not per script. An analysis declares the datasets it
  # read, and `--why` prints them under every observation that names it.
  # Every `upstream:` commit below is in the Lazuli repository (private) named in the header, and
  # its files are vendored at the `path:` given. 584e5a91a and 8474722e9 are
  # merge commits in that repo's `development` history. 9344787 is the tip of
  # the harness branch LDA-1349-grader-eval-harness.
  - id: jorgpt-agreement
    title: >-
      Score the shipped grading prompt against JorGPT's teacher grade on two
      model tiers, and report QWK, MAE, spread ratio and bias against the
      baselines the corpus ships
    prespecified: false
    code:
      repo: "https://github.com/Learning-Design-Alliance/Learning-engineering-research"
      commit: 21487fea78ff41023ac302eaf6a387d6b8c7123a
      path: studies/measurement/grader-eval/vendor/934478716/lazuli-app/scripts/grader-eval/run.ts
      upstream:
        repo: "the Lazuli repository (private)"
        commit: 9344787165e7a497131d03302ef0c67a8afd16f1
        path: services/lazuli-app/scripts/grader-eval/run.ts
    environment:
      kind: process
      detail: >-
        Node 22, pnpm; Vercel AI SDK against hosted Gemini
        (gemini-3.5-flash-lite as Model.LITE with thinking off,
        gemini-3.7-flash as Model.STANDARD with thinking on). Calls
        `buildGradingPrompt` and `gradingSchema` from
        src/lib/ai/grading/prompt.ts (vendored beside the harness), the prompt
        and schema the production grader used at that commit. Everything around
        the model call (database, anonymisation, xAPI dispatch) is skipped. The
        runs resolved ai 6.0.233, @ai-sdk/google 3.0.98, @ai-sdk/openai 3.0.86
        and zod 3.25.76 from the app's lockfile (sha256 in each VENDORED.md).
        The lockfile named here was generated on 2026-10-05 for the vendored
        snapshot and resolves the same version of every package on the model
        call path (ai, @ai-sdk/gateway, google, openai, provider,
        provider-utils, zod, eventsource-parser); it differs from the app's
        only in test and transpile tooling (vite, esbuild and their
        dependencies).
