  - id: asap2
    title: >-
      ASAP 2.0: 24,728 source-based argumentative essays, grades 6, 8, 9 and 10, one holistic human score (1-6) each, from two adjudicated expert reads, with English-learner, economic,
      disability, gender and race/ethnicity fields
    grain: one student's essay with its holistic human score and demographic fields
    format: other
    size_bytes: 22983137
    location:
      kind: url
      ref: "https://www.kaggle.com/datasets/lburleigh/asap-2-0"
    # asap2.zip, Kaggle dataset version 8; hash as recorded in
    # data/data-sources.json (`asap2`).
    sha256: afef0d8b2b578ceff6bc0ef6286f37fd5d8da260d97ad2567c6b96cdd75cd964
    identifiability: deidentified
    access: raw
    note: >-
      Crossley, Baffour, Burleigh and King 2025, CC BY 4.0. Two expert reads with adjudication (for the PERSUADE 2.0 essays, double-blind with 100 percent adjudication; the data paper reports pre-adjudication r = .75 for both subsets) per essay; only "the average
      human assigned score" (an integer 1-6) is released, so no per-item
      human ceiling can be computed here. The data paper reports
      pre-adjudication agreement of weighted kappa .745 / .659 and r .750
      (Assessing Writing 65, 100954, section 3, p. 3). The demographic fields are analysis metadata
