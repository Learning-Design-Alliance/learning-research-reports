        per-case-dumps.rebuilt.sha256 (added after reproduction-5). Slope of d on
        the label gap with tail, own label and teacher mark held fixed;
        learner-cluster bootstrap within tail, 4,000 replicates; rho = slope x
        mean gap / L. Invocation: `dose.py --run --dump-dir <D>` (writes
        out/results.json); post-hoc leave-one-model-out `dose.py --posthoc --dump-dir <D>`.
        Result: GRADED-ACROSS-MODELS, pooled rho +0.84 [+0.38, +1.36]; only
        Qwen passes the floor alone (GRADED, +0.148 [+0.049, +0.255] per
        label point); ASAP Qwen MONOTONE-DOSE / CONCAVE.
    inputs:
