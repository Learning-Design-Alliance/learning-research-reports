      path: studies/measurement/grader-ceiling-robustness/robustness.py
    environment:
      kind: process
      detail: >-
        Pre-registered at b1b954d, before any grader mark was read; detection
        floor (rev 1) and the AC2 self-test (Gwet's irrCAC worked examples,
        reproduced exactly) passed before the run. No model call. Python
        (numpy; pinned in studies/measurement/grader-eval/analyses/
        requirements.txt). Reads the analysed Mohler CSV (1,727 rows), the
        Menagerie grades.csv, and the grader-label-stability per-case marks
        (300 Mohler answers / 62 questions and 60 Menagerie programs x 4
        dimensions, Gemini 3.5 Flash Lite, GPT-4.1-mini and Qwen3-235B, under
        a high and a low attainment label), verified against
        grader-eval/analyses/per-case-dumps.sha256. `robustness.py --selftest`,
        then `--floor --dump-dir <D>` and `--run --dump-dir <D>` (<D> a dump directory rebuilt from `per-case-model-outputs` as above, holding grader-label-stability/; its files pass the per-dump sha256 check; run with OPENBLAS_NUM_THREADS=1, as the outputs were regenerated from the published file; the default thread count gives the same bytes), writing out/selftest.json, out/floor.json and
        out/results.json; `--posthoc --dump-dir <D>` writes out/posthoc.json (constant-grader
        readings, added after the run, reported only). Clusters: Mohler
        questions, Menagerie submissions; 4,000 resamples. Results: T1
        BLUNT-INSTRUMENT-SUPPORTED (grader better where the humans agree in 4
        of 6 model-by-corpus cells after standardising for level; about half,
        0.45-0.55, of each grader's squared error against one human is that
        human's own noise, every interval above 0.25, with the Mohler raters'
        +0.89-point offset straining the independence assumption; reference
        swing 0.23-0.27 on three models); T2 CEILING-STATISTIC-DEPENDENT
        (AC2 0.858 against QWK 0.519 on Mohler, 0.887 / 0.749 against 0.465 /
        0.424 on Menagerie, per-pair 0.61-0.92 against 0.035-0.730; no
        grader-versus-human comparison reverses). Post hoc: a constant grader
        scores AC2 0.854 (Menagerie, always A-) and 0.926 (Mohler, always 5),
        above the humans, so AC2 is not used to score graders. Its statement
        that the 150-answer ceiling draw does not re-derive (0.478) was a
        rebuild of the taxonomy draw; see `mohler-ceiling-draw`.
    inputs:
