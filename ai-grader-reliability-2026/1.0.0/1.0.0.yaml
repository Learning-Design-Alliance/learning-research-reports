# THE CODE IS VENDORED HERE (corrected in place 2026-10-05, still unpublished).
# The harness was written inside the product repository
# (the Lazuli repository, private), because it
# calls the production grading prompt directly. A commit in a private repo is
# not reproducible by a reader, so each cited commit's harness and every app
# file it imports were copied byte for byte into this repository under
