schema_version: 1

release:
  id: ai-grader-reliability-2026
  version: 1.0.0
  title: >-
    Reliability, calibration and attack surface of an LLM short-answer grader,
    measured against three human-graded corpora
  released_at: 2026-09-25
  # The QUESTION, not the finding.
  question: >-
    For an LLM grader scoring free-text answers against a rubric: how closely
    does it agree with expert human graders, and how closely do those graders
    agree with each other; how stable is the grade when the same work is
    submitted again or reformatted; which context additions improve it and
    which only bias it; and can a learner move their own grade by writing to
    the grader rather than to the question?

protocol:
  ref: open-graded-short-answer-corpora
  version: 1.0.0

no_study_reason: >-
  No study plan object was written for this investigation. It began as an
  engineering evaluation of a shipped grading prompt and grew adaptively: most
  arms exist because an earlier result suggested them. A plan written now would
  post-date its own findings. Each analysis records this in `prespecified`.

research_design:
  # Not an RCT and not a simulation. Every configuration is applied to every
  # sampled case: a full within-item crossover with no assignment of people,
  # because the units are archival answers. The closed vocabulary has no value
  # for that shape, so `other` with this detail.
  family: other
  detail: >-
    Two shapes. (1) Repeated-measures ablation over archival human-graded
    answers (JorGPT, Mohler). Cases are drawn by stratified sampling across the
    grade range, or across the learner's held-out attainment for the attainment
    arm, and every grader configuration scores every sampled case, so each case
    is its own control and contrasts are within-item. The human grade shipped
    with the corpus is the reference. The only stochastic element is the model
    call, which is why run-to-run spread is measured separately and treated as
    the instrument's resolution. (2) Inter-rater agreement between humans, with
    no model involved: two raters on Mohler, 28 recruited graders on
    Menagerie, and four instructors on every item of HARMOGEN-R.
  preregistration:
    registered: false
    note: >-
      Not preregistered, and the analysis order was adaptive: several
      configurations were tested because an earlier result suggested them.
      Recorded because a reader who has to infer it will infer wrongly. Results
      first seen at n=40 were re-run at n>=150 before being reported, and the
      attainment contrast was re-run with a draw sampled on attainment, 150 per
      tail, across three models. THE RE-TESTS ARE THE EXCEPTION: every analysis
      below marked `prespecified: true` (swapped label and paired intervals,
      model breadth and reasoning, item types and scales, exemplar marks, the
      loop simulation, the label effect by demographic group, the
      matching-artefact correction) was pre-registered in a commit of the
      research repository before any model call, with its threshold, verdict
      wording and detection floor; the study directories record each commit.
      Exceptions inside them: in the swapped-label study the verdict rule was
      revised after its floor failed, while model outputs sat unread, and the
      revision was committed before any output was read; the Pearson-r check
      and the recentred "usable prior" reading were added after the runs and
      are reported, not pre-registered; the matching-artefact study's check of
      the label-by-group contrasts was added after the planned label-by-group
      analysis and does not re-cut its verdicts.

datasets:
  - id: jorgpt-answers
    title: >-
      JorGPT: 3,041 teacher-graded answers to 50 open-ended computer-science
      questions from 79 students, with four LLM baselines per answer
    grain: one student answer to one question, with its teacher grade
    format: csv
    rows: 3041
    size_bytes: 14558120
    location:
      kind: url
      ref: "https://zenodo.org/records/18981627"
    # dataset_en.csv, the English file of the deposit. Hash computed over the
    # downloaded file on 2026-09-25; the Zenodo MD5 (196825ce...) matches.
    sha256: 1d5deb07247a415181f1999e66763c29a2a4df9130d0ad6e9bc813f64343653c
    identifiability: deidentified
    access: raw
    note: >-
      File dataset_en.csv (the deposit also carries a Spanish file, not read).
      Every row carries the corpus's `teacher_corrected` flag, so the reference
      grade is an independent human judgement rather than a model grade a
      teacher declined to change. 5.9% of teacher grades coincide exactly with
      the deposit's judge LLM. This was checked before any result was trusted.
      The loader drops ten rows with an empty answer, leaving 3,031 cases.

  - id: mohler-answers
    title: >-
      Mohler ASAG: 2,273 data-structures answers to 80 questions, each graded
      independently by two graduate assistants
    grain: one student answer to one question, with two independent rater scores
    format: csv
    rows: 2273
    size_bytes: 702489
    location:
      kind: url
      ref: "https://huggingface.co/datasets/nkazi/MohlerASAG/blob/dac06732b42d01a5169f543f6d272f1476cced3e/data/cleaned-oe-00001.parquet"
    # The hash is of the CSV the harness read. It is a deterministic export of
    # the parquet above by studies/measurement/grader-eval/analyses/mohler_to_csv.py
    # (commit 6d450970cc905fb5d6a0dc56075c6fb47da603cd), reproduced byte for
    # byte on 2026-09-25 and again by the 2026-10-06 independent reproduction.
    sha256: 7c64b6e1eb9ef95121cb912e273b208130ec4f79c5cf1ea888970026fd605901
    identifiability: deidentified
    access: raw
    note: >-
      The mirror ships parquet only. The analysed CSV is the `cleaned` config,
      `open_ended` split (data/cleaned-oe-00001.parquet at revision dac06732,
      153,016 bytes, sha256
      f2aff37d7a3c6e6a7267afe0ab29ca4ebfbf90285b8eea77b08da9e1217376b0),
      written with Python's csv module: header row, CRLF line endings, floats
      as repr(). THE ONLY CORPUS HERE WITH TWO RATERS ON ORDINARY MARKING.
      Data-quality warning for anyone re-running this: 546 of the 2,273 rows
      record per-rater scores on 0-10 while `score_avg` stays on 0-5, and some
      cannot be reconciled by any single rescaling. See `mohler-consistent`.

  - id: mohler-consistent
    title: >-
      Mohler ASAG rows whose two rater scores are internally consistent with
      the published mean
    grain: one student answer to one question, with two independent rater scores
    format: csv
    rows: 1727
    # Derived in memory by `loadMohler` and never written to disk, so there is
    # no file to hash or deposit. It regenerates exactly from `mohler-answers`,
    # whose hash is above.
    location:
      kind: not-yet-deposited
    identifiability: deidentified
    access: derived
    derived_from:
      - mohler-answers
    note: >-
      Keeps only rows where both raters lie in 0-5 and (r1 + r2) / 2
      reproduces `score_avg` exactly. Rescaling the other 546 would invent
      rater disagreement, which is the one quantity the ceiling measures. The
      filter is NOT neutral: excluded rows agree less than kept ones, so the
      measured ceiling is an over-estimate.

