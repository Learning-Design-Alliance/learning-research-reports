  - id: harmogen-r
    title: >-
      HARMOGEN-R: 770 responses from a university data-structures course, each
      evaluated by four instructors and three LLMs under five rubric variants
    grain: one evaluator's score on one response under one rubric variant
    format: other
    size_bytes: 42732329
    location:
      kind: doi
      ref: "10.5281/zenodo.19534458"
    # harmogenr_dataset_v2.zip. Hash computed over a fresh download on
    # 2026-10-06; its MD5 (68a8a970...) matches the Zenodo record.
    sha256: d83ee9e6ee12adbfe127eed5f44fbacc996b2d3acdf013a9ec19ce0db26f0206
    identifiability: deidentified
    access: raw
    note: >-
      Mendonca, Quintal, Mendonca and Baras 2026, CC BY 4.0. Responses in
      Portuguese. Re-analysed as arithmetic over the depositors' own published
      evaluations; the release runs no model on it. Governed by the protocol's
