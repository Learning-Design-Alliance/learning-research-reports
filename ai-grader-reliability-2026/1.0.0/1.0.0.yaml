interpretation: >-
  Agreement with one human is a weak instrument on short free-text answers. On
  the only corpus here with two raters doing ordinary marking, the two graduate
  assistants agree with each other at QWK 0.519, while this grader agrees with
  one of them at 0.798 and the other at 0.549. A second corpus built to study
  grader consistency puts 28 recruited graders at 0.465 on a comparable scale,
  and per-pair agreement there runs from 0.035 to 0.730. On Gemini 3.5 Flash
  Lite, none of four interventions moved agreement resolvably on the
  single-rater corpus (three single runs and one interval that leaves room for
  +0.056): a better model tier, pooling three or four calls, anchor exemplars,
  and showing the grader the learner's previous attempt; graded exemplars did
  raise a harsh second model's QWK by 0.033. On the two corpora where it can be measured, much of the residual
  disagreement is noise in the human reference: about half (0.45-0.55) of
  each of three graders' squared error against one human is that human's
  own disagreement with the others (`ceiling-robustness`). The ceilings are
  kappa figures: under Gwet's AC2 the same raters agree at 0.858 (Mohler)
  and 0.887 (Menagerie, five levels), because kappa falls when marks bunch
  at one end of the scale; no grader-versus-human comparison reverses.

  What is left is not only about accuracy. First, calibration. The cheap model
  runs generous (+0.19 to +0.38 depending on the draw), and two interventions
  remove most of that on the original draw: the better tier (bias +0.34 to
  +0.01) or three human-graded anchor answers (+0.38 to +0.06). Neither
  improved Gemini's agreement. The anchors turn out to shift the grade by the
  level they are marked at rather than to calibrate it: on a wider draw they
  overshot, and on a harsh second model they did not resolvably move bias and
  raised its QWK by 0.033. Calibration and agreement are separate quantities,
  because QWK penalises a constant offset only through its square relative to
  the score variance: an offset large enough to move a pass decision costs
  well under 0.02 of kappa here.

  Second, stability. On one model, in single runs, re-grading byte-identical
  text lands on a different integer grade a quarter of the time, and
  reformatting the same words moves it more than twice as far as re-running
  does, on matched cases. There is no consistent direction across variants
  (signed means -0.10 to +0.22 at n = 30 each, no intervals), so no penalty for
  any layout was detected. It is a shift in where the grader settles, which is
  why pooling does not fix it. The fix is not to re-grade: key the grade on a
  normalised content signature per learner and return the stored grade. That
  removes every layout-only variant and re-grades genuine text changes. It must
  be keyed per learner, because 2% of this corpus is identical text from
  different students and the teacher graded most of those 18 groups
  differently.

  Third, context about the learner changes the mark on identical work. On one
  model (Gemini 3.5 Flash Lite), a previous attempt shown with a low mark lowers
  the grade by 0.44 points on a 0-10 scale (95% interval 0.26 to 0.62; 0.59 in
  the first, single run); with a high mark it does not raise it; the same weak
  attempt without its mark does not lower it, but a strong one without its mark
  lowers it by 0.24. Told the learner's held-out attainment, the grader gives
  the same answer 0.28 to 0.75 points more under a high label than a low one,
  on 300 answers from 33 students, on six models from five developers including
  a frontier model and two open-weights families, inside both tails of the
  attainment distribution (6 or more and below 4 of 10; the middle was not
  sampled); with one model's reasoning off, 1.04. On whole programs the effect
  reached 1.4 to 2.3 points on a 14-level rubric on two of three models.
  Whether the label moves weak learners' marks toward or away from the teacher
  differs by model, in the direction of each grader's own error in that tail
  (a pattern, not a tested mechanism), so it is not a uniform penalty on the
  weak; a false low label costs strong work 0.3 to 0.8 points. No change in
  how the grader ranks answers was resolved (no resolved change in Pearson r on
  any run, though intervals reach +0.05); on three harsh graders the label
  raises QWK by 0.03 to 0.05, consistent with moving where marks land. A
  simulation driven by four of the measured graders shows that feeding the
  belief back into the grader amplifies the effect modestly (1.07 to 1.17 over
  a term) and stays stable. The attainment result is the one to refuse
  outright. A learner model's estimate should be updated by the assessment,
  and feeding it back into the grader closes a loop that should stay open. On
  3,000 ASAP 2.0 essays with demographic fields the label's effect did not fall
  harder on any group tested on two models, relative to no label (every
  resolved difference favoured the focal group, each time on one model only
  (English learners and disability-identified students on Qwen, economically
  disadvantaged students on GPT-4.1-mini), and on Qwen partly an artefact of matching on a noisy human score); against a same-length neutral statement the
  low value cost English learners, economically disadvantaged and
  disability-identified students 0.06-0.08 more on Qwen (also partly the
  matching artefact; corrected at the reliability implied by the data paper's rater agreement (0.75–0.86), the English-learner difference stays beyond the
  multiple-testing bar, the economic one only at 0.86, and the disability
  one at neither). A deployment
  whose labels track attainment would open a projected
  0.01-0.07 of a level. The graders' own unlabeled gap against English learners
  and disability-identified students is 0.21-0.32 of a level at equal human
  score. Part of that is the artefact of matching on a noisy score, and
  0.15-0.27 remains at equal true quality at the reliability implied by the data paper's rater agreement (0.75-0.86). It would be fully explained only near 0.5,
  which that agreement rules out. So it is a fairness problem larger than
  the label's, measured against human raters whose own group neutrality is
  not tested: whether ASAP 2.0's raters, who had anti-bias training, marked
  every group alike at equal quality is the open question.

  Course context splits by corpus, in single runs. Sibling questions raised
  agreement on terse answers and more graph context lowered it on long ones,
  each by a few hundredths, at the edge of the evaluation's resolution; related
  and unrelated siblings did not differ detectably. That item signal density
  explains the split is a candidate reading of two corpora, and a reason to set
  context per activity type rather than globally.

  Finally, the attack surface. On one model, 50 answers per arm, a single run,
  in the prompt as measured, appending a sentence claiming to be a note from
  the instructor gains 4.6 points out of 10 on average, up to a full 10, and
  inflates 90% of attempts, while the prompt's penalty for manipulation fires
  in none of them. The overt "ignore all previous instructions" attack is
  penalised 88% of the time; the defence is blind to text that does not look
  like an attack, because the response was interpolated without a boundary.
  Instruction hardening halves the gain and leaves two thirds of attacks
  working. Wrapping the response in a per-submission unguessable marker
  inverts it (mean -0.42, 8% inflated), because a learner cannot forge a
  delimiter they have never seen. That is a structural fix rather than a
  persuasive one. The deployed defence has not been re-measured.

limitations:
  - >-
    FORMATIVE STAKES ONLY. In Lazuli the grader gives formative feedback as
    students prepare for assessments that people grade; nothing the AI
    generates is used to grade them. The effects measured here therefore reach
    students through feedback and through the learner model's estimate, not through grades of record. The platform does not adapt by default; only a course built to choose the next item from the estimate would also route students by it. The
    same grader used to grade would carry them into a higher-stakes setting,
    which this release does not study.
  - >-
    PROXY POPULATIONS, AND THIS IS THE LIMITATION THAT GOVERNS ALL THE OTHERS.
    University computer-science answers, other people's questions, other
    people's rubrics. These figures describe grader mechanics. They do not
    describe how the grader behaves on a Lazuli course, and no figure here
    should be quoted as production calibration.
  - >-
    THE AGREEMENT RESULTS ARE SHORT FREE-TEXT ANSWERS ONLY. Menagerie supplies
    a human ceiling, and the grader was run on it only in the label-stability
    re-test (60 programs under a high and a low label), which measures the
    label's effect, not agreement; marks there tracked the raters at r 0.25 to
    0.58. Later work in the Lazuli repository (private), not reported here, graded whole
    Menagerie programs and found the grader far below the human ceiling, near
    zero on the readability and documentation dimensions. The agreement result
    does not extend to large artefacts or craft rubrics.
  - >-
    Sampling is stratified across the grade range, which inflates absolute
    agreement by roughly +0.03 against the full corpus (0.833 stratified, seed
    7; 0.799 on all 3,041 rows; 0.795 on one random draw whose seed was not
    recorded, and 0.795 averaged over 200 uniform random draws, computed by
    `resolution-sampling-sd`). This is a comparison instrument, not an
    estimate of population agreement. Subtract roughly 0.03 to read any
    absolute figure here as a corpus-level number.
  - >-
    "NO ACCURACY GAIN" IS AN INTERVAL, NOT AN EQUIVALENCE (added 2026-10-05,
    reviewer question Q4). Paired, learner-clustered bootstrap intervals on the
    change from control, with margins fixed before the run (QWK +/-0.02, MAE
    +/-0.10): attainment arm, QWK change +0.003 [-0.010, +0.017] on Gemini 3.5
    Flash Lite (equivalent on both), +0.003 [-0.021, +0.027] on GPT-4.1-mini,
    -0.001 [-0.027, +0.018] on GPT-5-mini, -0.010 [-0.047, +0.023] on
    Qwen3-235B; on three later runs (Claude Opus 5.5, Llama 4 Maverick,
    GPT-5-mini at minimal reasoning) the true label RAISED QWK by +0.029,
    +0.046 and +0.039 with intervals clear of zero, while no change in Pearson
    r was resolved on any of nine runs checked (a check added after the runs,
    with intervals reaching +0.049, the size of those gains), so the gains are
    consistent with where marks land on harsh graders, and a ranking gain is
    not excluded; attempt-history arms (n=150, 65
    learners), QWK changes from -0.015 to +0.019 with intervals reaching +0.056
    and MAE intervals of about +/-0.17, none equivalent. A floor run before the
    data were read showed that at n=150 a null arm reaches equivalence at the
    +/-0.10 MAE margin only 4% of the time, so equivalence was unreachable by
    design here; the supportable statement is "no gain larger than" the
    improving-side bound of each interval. Numbers in
    studies/measurement/grader-attainment-prior/out/.
  - >-
    BIAS OR PRIOR (added 2026-10-05, reviewer question Q2). A swapped-label arm
    on identical work confirms the attainment label itself moves the grade, in
    both tails (the draw sampled only the tails) and on every model: a high label rather than a low one on the
    same answer adds +0.37 (Gemini 3.5 Flash Lite), +0.38 (GPT-4.1-mini), +0.52
    (GPT-5-mini) and +0.75 (Qwen3-235B-A22B-2507, open weights, added to close
    the open-weights gap); and, in a further re-test, +0.28 (Claude Opus 5.5,
    the smallest) and +0.54 (Llama 4 Maverick). Whether the true label moves grades toward or away
    from the teacher differs by model, in the direction of each model's own
    error in that tail (a pattern across six models, not a tested mechanism).
    On Gemini the low-tail penalty moves a generous control toward the teacher
    (+0.49 to +0.27, with no resolvable change in MAE): TOWARD. On
    GPT-4.1-mini and Qwen the grader is already harsh in the low tail and the
    penalty makes it harsher (-0.46 to -0.72; -0.41 to -0.75): AWAY. On
    GPT-5-mini the low tail moves from about 0 (+0.08, unresolved) to -0.44.
    Pre-registered verdict MIXED-ACROSS-MODELS (per model: UNRESOLVED on
    Gemini and GPT-5-mini, MIXED on GPT-4.1-mini, Qwen and Opus, PRIOR on Llama
    4 Maverick and GPT-5-mini at minimal reasoning). These per-model readings
    are against a control with no added sentence. Against a same-length
    neutral sentence (analysis neutral-control, Gemini only), a sentence's
    presence alone raised high-tail marks by +0.14 [+0.05, +0.24]; Gemini's
    reward falls to +0.08, unresolved, and its verdict reads PRIOR; the
    penalty holds. The other models' readings are against the bare control
    only, and on a grader harsh on strong work a presence effect of that sign
    would read as toward. L itself compares two same-length sentences and is
    unaffected; it grows with the gap between the two labels across the six
    models (analysis label-dose), and Claude Fable 5.1, run on 100 answers as
    Claude Code subagents, shows it too (+0.31 [+0.19, +0.45], analysis
    fable-agent-label). None of the first four
    models shows an accuracy gain; three later runs gain QWK (above). "Bias" as
    a uniform accuracy harm is not supported; "a label that changes the grade
    on identical work and is not shown to improve ranking" is. The re-tests
    used the vendored prompt (studies/measurement/grader-eval/vendor/lazuli-app/,
    a copy of the product's prompt at its commit 277cd5085), whose rendered text
    matches 584e5a91a for these arms. See
    studies/measurement/grader-attainment-prior/README.md in this repository.
  - >-
    The harness resolves differences of about +/-0.02 QWK at n=150, set by
    judgement at about twice the model spread (0.011 across three identical
    passes). Anything smaller is not a result. Two
    conclusions sit on that limit and are labelled borderline in their own
    records: "this prompt beats the corpus baselines" (0.853 against 0.833) and
    the model tier's agreement advantage (0.016-0.027 depending on run). The
    tier's bias advantage is solid; its kappa advantage is not. The sampling
    standard deviations once quoted here (stratified 0.007, random 0.022) came
    from an uncommitted ad hoc resampling and are withdrawn. Committed code
    (`resolution-sampling-sd`) gives SD 0.024 over stratified draws and 0.031
    over uniform random draws, 200 seeds each, so stratification reduces
    sampling noise by about 1.3x at n = 150, not threefold (an intermediate
    0.020 came from a non-uniform shuffle). Sampling variance cancels in the
    paired comparisons every verdict rests on.
  - >-
    At n=40-60 nothing that matters is resolvable. At n=40 the low-prior
    attempt-history arm read QWK 0.930 against a 0.886 control; at n=120 the two
    were level. Pooling was first run at n=40 and re-run at n=150, and
    only the n=150 figures are reported.
  - >-
    THE HUMAN CEILING BELONGS TO THE TASK. Two corpora put pooled human
    agreement below 0.52 on open-ended marking (neither records whether its
    graders were trained), but neither figure is "the ceiling":
    Menagerie's per-pair agreement spans 0.035 to 0.730. HARMOGEN-R, in this
    release, puts four instructors at QWK 0.981 on a corpus of near-closed
    items, and 0.942 on its genuinely open half, so a low ceiling is a property
    of open-ended judgement, not of human graders in general.
  - >-
    The Mohler ceiling of 0.519 is an OVER-ESTIMATE and must not be quoted as
    the ceiling. The consistency filter removed the cases the raters disagreed
    on most. The excluded-row figure (QWK 0.418, exact agreement 52.4%) halves both
    raters' 0-10 scores and rounds half to even; it now reproduces from
    committed code (`mohler-removed-rows`, 2026-10-06). The rescaling is a
    choice: rounding half up gives 0.410, halving only scores above 5 gives
    0.377, and the raw 0-10 scores give 0.411. Every one is below 0.519, so the
    direction holds; the exact value depends on the rescaling.
  - >-
    The ceiling comes from different corpora, scales and domains than the
    agreement figures it is used to interpret, and Mohler is skewed toward
    correct answers (mean grade 4.18 of 5 across the full corpus). JorGPT has
    one rater, so its own ceiling is unmeasurable. "0.83-0.87 is above human
    consistency" is a transfer across corpora, not a measurement.
  - >-
    Agreeing with the MEAN of two raters (0.711) is mechanically easier than
    agreeing with either one, since averaging cancels part of the noise. The
    honest head-to-head is the per-rater pair, 0.549 and 0.798, and the spread
    between those two is itself a caution about any single-rater figure.
  - >-
    THE CEILING LEVELS ARE KAPPA FIGURES. Under Gwet's AC2 the same raters
    agree at 0.858 (Mohler, against QWK 0.519) and 0.887 / 0.749 (Menagerie,
    five / fourteen levels, against 0.465 / 0.424): the kappa paradox, since
    Mohler's marks bunch at the top. No grader-versus-human comparison
    reverses under AC2, but on Menagerie QWK puts every grader far below the
    humans and AC2 does not resolve a difference (-0.04 to +0.05 on fourteen levels, intervals up to +/-0.13). QWK is kept because AC2 credits a
    constant grader above the humans (0.854 for always A- on Menagerie,
    0.926 for always 5 on Mohler). The noise share of about half assumes
    the grader's errors are independent of the raters', which Mohler's
    +0.89-point rater offset strains, and whether the items humans disagree
    on are noisy or also hard for the grader is unresolved
    (`ceiling-robustness`).
  - >-
    POOLING WAS FIRST MEASURED IN QWK ONLY, and QWK penalises the compression
    averaging creates. Later work outside this release, on Menagerie (whole
    programs), found that pooling nine passes raised Pearson r by about 0.02
    while QWK moved by 0.003. Re-run on JorGPT on 2026-10-05 with nine LITE
    passes and per-case scores
    (studies/measurement/grader-attainment-prior/pooling.py in this repository):
    r +0.0035 (learner-clustered 95% interval +0.0026 to +0.0048, inside a
    pre-set +/-0.01 equivalence margin), QWK +0.007, MAE unchanged. Repeated
    grades of one short answer have sd 0.18 and never straddle the teacher's
    mark, so there is nothing to average. The null holds on short answers in r
    as well as QWK; the Menagerie gain belongs to long, noisier items.
  - >-
    The goal-graph results contradict each other across corpora and each sits
    at the edge of the harness's resolution in a single run, so neither
    generalises on its own.
    The reconciling account (sparse items benefit from course context, rich
    items are diluted by it) is fitted to two data points and is offered as a
    hypothesis to test per activity type, not as a finding.
  - >-
    Within the Mohler taxonomy arm, real siblings beat unrelated ones by 0.013,
    below resolution. "Relatedness does not do the work" is a non-detection at
    this n, not a demonstrated null.
  - >-
    An early version of the attainment arm keyed the held-out mean on the
    question rather than the learner, which measures item difficulty. The
    harness now carries a learner id on every case, and every attainment figure
    here comes from the learner-keyed run sampled 150 per tail.
  - >-
    Single runs at n=150 for the graph and taxonomy arms and the tier
    comparison. The exemplar and history arms were first single runs and were
    re-run in 2026-10-05's pre-registered re-tests with clustered intervals
    (exemplars at n=600). No arm here has been replicated by anyone else, on
    any corpus, at any n.
  - >-
    Two Gemini tiers throughout, except the attainment arm, which also ran on
    two OpenAI models and, in the 2026-10-05 re-tests, on Qwen3-235B-A22B-2507,
    Llama 4 Maverick and Claude Opus 5.5 (six models, five developers), with
    reasoning varied on GPT-5-mini and Gemini 3.5 Flash Lite. Gemini 3.1 Pro and GPT-5.5 were not run as graders through the API (Gemini 3.1 Pro graded ten answers in a pricing probe), a scope decision on
    cost per grade; Claude Fable 5.1's API route was blocked by the account's
    zero-data-retention setting, and it was run on 100 answers as Claude Code
    subagents (`fable-agent-label`), outside the API condition and not pooled
    with it. No temperature, top-p, seed or direct-API token limit was sent by
    any run; the OpenAI re-tests used non-strict schema decoding where the
    originals were strict. The injection results in particular are properties
    of one model's instruction following as much as of the prompt.
  - >-
    English only. No non-English answers were graded in this release.
  - >-
    MARK ONLY. Every analysis uses the numeric score; the grader's feedback text
    and evidence weights were not analyzed. Whether the label changes the
    feedback needs a measure of feedback quality validated against independent
    human judgments, which this release does not have (future work).
  - >-
    ONE LABEL FORMAT AND ONE PROMPT TEMPLATE. The attainment label is one fixed
    sentence stating an explicit number, in one fixed position in the product's
    prompt template. Qualitative or implied descriptions of a student, other
    wordings, other templates and other positions were not tested (future
    work). Each answer is graded in its own call with no conversation history,
    as in the product.
  - >-
    THE DEMOGRAPHIC TEST IS NARROW. ASAP 2.0 only (secondary-school essays,
    one two-read, adjudicated human score per essay, which also defines
    "equal work"), two models
    (Qwen3-235B-A22B-2507, GPT-4.1-mini), one prompt template, and ASSIGNED
    labels (1.9/6 and 4.2/6), not true ones. Race/ethnicity groups were too
    small for the test (UNDERPOWERED, accepted in advance). The deployment gap
    (0.01-0.07 of a level) is a projection under stated reliability
    assumptions, not a measurement. Against a same-length mid label the low
    value took 0.06-0.08 more off English learners', economically
    disadvantaged and disability-identified work on Qwen, so "uniform" holds
    for the high-versus-low contrast (within a +/-0.10 margin nearly half the
    size of GPT-4.1-mini's label effect), not for every contrast. "Equal work"
    is equal two-read, adjudicated human score: the graders' unlabeled group
    gap of 0.21-0.32 at that score is partly an artefact of matching on a
    noisy score, and 0.15-0.27 remains at equal true quality at the data
    paper's rater reliability (0.75 for one rater, about 0.86 for two reads);
    it would vanish only at about 0.5. The correction assumes rater error is
    independent of group; rater DIF is not tested
    (studies/measurement/grader-matching-artefact/). On Qwen the label's own
    effect depends on essay quality, so its favouring label-by-group
    differences carry up to 0.03 (at 0.75) or 0.014 (at 0.86) of the same artefact (a check added after the
    planned analysis).
  - >-
    THE LOOP RESULT IS A SIMULATION. The compounding estimate drives a
    Beta-Bernoulli learner model with graders fitted from four of the six
    models' swapped-label runs on one corpus, linear in the label and measured only in the two
    attainment tails, and converts the grade to evidence; it models no other
    output of the grader, which the label may also move. A
    deployment comparison would measure what it bounds.
  - >-
    THE LABEL EFFECT'S SIZE IS ITEM- AND MODEL-SPECIFIC. Its sign held in all
    13 model-by-corpus cells of the label-stability re-test, but on whole
    programs it was 0.4x to 2.8x its short-answer share depending on the
    model, confounded with task and rubric. Short-answer 0-10 magnitudes do not
    transfer to other item types.
  - >-
    The injection sweep is n=50 per payload per arm. `forged-system` should be
    read as grader noise rather than a second exploit: its mean stays near zero
    in every arm while about 40% of cases move up, the rate at which any
    perturbation moves a score up. One model, one payload family, a single
    run.
  - >-
    At the measured commit both injection defences were opt-in parameters, so
    the shipped prompt was unchanged and the comparison measurable. Both were
    then enabled in the production grading path by LDA-1344: merged 2026-09-15
    (#3006), reverted 2026-09-17 (#3060) and re-landed 2026-09-22 (#3062). The
    defence has not been re-measured as deployed.

funding: >-
  None. Internal engineering work by the Learning Design Alliance, conducted as
  part of building the product it evaluates. No external funder, no grant.

conflicts: >-
  Declared rather than mitigated: the grader under test is the Learning Design
  Alliance's own product, the prompt evaluated and the harness were both written
  there, and the release reports that the product's prompt scores above the
  corpus authors' baselines, by a
  margin on the resolution limit. Nobody outside the team has run any of it. Two
  structural mitigations exist and neither is independence. The harness calls
  the production prompt and schema directly rather than a favourable
  reconstruction, so a flattering result cannot be obtained by evaluating a
  different prompt. The corpora, the human grades and the competing baselines
  were all authored by other people. The findings that reflect worst on the
  product (an injection exploit, a group gap the grader shows with no label
  (larger than the label's at the reliability implied by the data paper's rater agreement; it has not been tested on a second essay corpus within this release), a quarter of
  re-grades landing on a different level) are the ones this release is most
  confident in.

