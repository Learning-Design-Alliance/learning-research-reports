# The findings are NOT restated here. They are records in observations/, and
# each names this release back.
evidence:
  - ref: lazuli-grader-jorgpt-2026/agreement-vs-teacher
    note: >-
      The headline agreement level. Its margin over the corpus baselines sits
      on the resolution limit. Read with `spread-ratio`.
  - ref: lazuli-grader-jorgpt-2026/spread-ratio
    note: >-
      The number that says the agreement figure is not bought by hedging to
      safe mid-scores.
  - ref: lazuli-grader-jorgpt-2026/model-tier-bias
    note: Tier buys calibration, not agreement.
  - ref: lazuli-grader-jorgpt-2026/pooling-agreement
    note: A measured null on QWK. See the limitation on what QWK cannot see.
  - ref: lazuli-grader-jorgpt-2026/pooling-stability
    note: Pooling judged as a variance reduction. Also null.
  - ref: lazuli-grader-jorgpt-2026/formatting-movement
    note: Reformatting shifts the grade, and is not merely re-sampling.
  - ref: lazuli-grader-jorgpt-2026/signature-cache-coverage
    note: The fix that follows from the two records above.
  - ref: lazuli-grader-jorgpt-2026/cross-learner-signature-collision
    note: Why that cache must be keyed per learner.
  - ref: lazuli-grader-jorgpt-2026/exemplar-calibration
    note: >-
      Carries its own control for "is this just more context": the ungraded
      arm is worse than no exemplars at all.
  - ref: lazuli-grader-jorgpt-2026/attempt-history-anchoring
    note: A low prior mark lowers the grade on identical work.
  - ref: lazuli-grader-jorgpt-2026/attempt-history-mark-is-the-mechanism
    note: The prior mark, not the prior work, is the active ingredient.
  - ref: lazuli-grader-jorgpt-2026/attainment-bias-replicates-across-providers
    note: >-
      The original attainment contrast, 150 per tail, three models from two
      vendors, every interval excluding zero. Read with the swapped-label
      record, which says what it is.
  - ref: lazuli-grader-jorgpt-2026/attainment-label-moves-identical-work
    note: >-
      The label itself moves the mark on identical work on four models, in
      both tails; toward or away from the teacher by model.
  - ref: lazuli-grader-jorgpt-2026/label-effect-persists-at-the-frontier
    note: >-
      Claude Opus 5.5 (smallest effect) and Llama 4 Maverick; per-learner
      effects; the small QWK gains on harsh graders with r flat.
  - ref: lazuli-grader-jorgpt-2026/reasoning-off-doubles-the-label-effect
    note: GPT-5-mini with reasoning off shows twice the label effect.
  - ref: lazuli-grader-jorgpt-2026/exemplar-marks-pairing-and-level
    note: >-
      Restates the exemplar mechanism: correct marks matter, and the grader
      adopts the level it is shown, so exemplars shift rather than calibrate.
  - ref: lazuli-grader-menagerie-2026/label-effect-on-whole-programs
    note: The label effect across item types and scales; sign stable, size not.
  - ref: lazuli-grader-asap2-2026/label-effect-by-demographic-group
    note: >-
      The label's effect does not fall harder on any group tested, relative to
      no label; against a same-length statement it costs three groups more on
      one model. The grader's own unlabeled group gap is larger.
  - ref: lazuli-grader-asap2-2026/no-label-group-gap-at-equal-true-quality
    note: >-
      The unlabeled grader gap corrected for matching on a noisy score:
      0.15-0.27 of a level remains at equal true quality at the reliability implied by the data paper's rater agreement (0.75-0.86); fully explained only near 0.5, which
      the raters' agreement rules out.
  - ref: lazuli-grader-loop-simulation-2026/label-loop-amplifies-and-stays-stable
    note: >-
      The belief -> label -> grade -> belief loop over a term: a stable, modest
      amplifier.
  - ref: lazuli-grader-jorgpt-2026/graph-context-dilution
    note: Contradicted on the other corpus. Read with `sibling-context`.
  - ref: lazuli-grader-jorgpt-2026/authority-claim-injection
    note: >-
      A trivially discoverable exploit in the prompt as measured, and the
      structural defence that closes it.
  - ref: lazuli-grader-menagerie-2026/ceiling-replicated
    note: >-
      The ceiling on a corpus built for the question, and lower than Mohler's
      on a comparable scale.
  - ref: lazuli-grader-menagerie-2026/ceiling-is-a-distribution
    note: Per-pair agreement runs from 0.035 to 0.730.
  - ref: lazuli-grader-menagerie-2026/agreement-varies-by-rubric-dimension
    note: Human agreement tracks how objective the dimension is.
  - ref: lazuli-grader-mohler-2026/human-human-ceiling
    note: >-
      The number that makes the agreement figures readable. An over-estimate,
      by the next record.
  - ref: lazuli-grader-mohler-2026/ceiling-is-over-estimated
    note: The consistency filter removed the cases the raters disagreed on most.
  - ref: lazuli-grader-mohler-2026/grader-vs-each-rater
    note: The head-to-head against each human rater.
  - ref: lazuli-grader-mohler-2026/ceiling-depends-on-the-statistic
    note: >-
      The same two raters at AC2 0.858 against QWK 0.519: the ceiling's level
