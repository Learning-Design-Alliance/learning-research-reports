        qmatrix_positivity.py --floor` (synthetic, out/floor.json), then
        `python3 qmatrix_positivity.py --corpus xes3g5m`, `--corpus assist` and
        `--corpus eedi` (out/<corpus>.json; each first reproduces the committed
        atlas rows), then `python3 qmatrix_positivity.py --summary`
        (out/summary.json, from the three and the floor). Environment
        variables: XES_DIR, ASSIST_DIR (assist_rich.csv), EEDI_ANSWERS,
