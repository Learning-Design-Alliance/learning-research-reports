interpretation: >-
  Observational learner records can rarely show that a prerequisite edge
  exists, and the statistic that appears to orient one sorts skills by
  difficulty. What the records do identify is dependence between skills. An
  edge from skill a to skill b is identified by comparing learners who met b
  after attempting a without passing it with learners who met b after passing
  a, and a prerequisite is taken to lower first-attempt accuracy on b by 0.10.
  Randomized release of an edge creates that comparison by design and ensures
  that a difference between groups is not general ability, though a trial
  still needs hundreds of learners for each edge it tests.

  Existence (RQ1; real learner records). The comparison was rarely large
  enough to test. Most pairs of skills are attempted by few of the same
  learners: the median pair had no learner in common on EDM Cup and only 4 on
  ASSISTments. Where a pair is covered, its identifying cell holds tens of
  learners on most corpora, where a test of a 0.10 drop needs between 277 and
  379 learners in each group; only Eedi, with 118,971 learners, could test
  more than a quarter of its pairs. A uniform order of skills hides only the
  reverse direction of a pair, and how a platform documents its order did not
  predict which corpora could decide pairs. In ASSISTments 2012-13's
  random-order configuration, problems are randomized but skills are not:
  across 3,838 combinations of a problem set and a pair of skills, within no
  problem set did more than 15 students meet a pair of skills in the less
  common order. Most of the supported verdicts did not survive an adjustment
  for general ability: in the four corpora with enough supported edges to
  check, at most 27.6% survived an adjustment for each learner's accuracy on
  other skills. Most negative verdicts fail on power rather than positivity:
  across the atlas file's corpora, the reachability gate returned 1,183 of
  1,399 powered pairwise nulls to unknown, and in 1,155 of those (97.6%) a
  merge node was readable but not powered. What empties the identifying cell
  is which learners met which skills, and when, not the design of the items.
  Where the contrast exists, the drop is smaller after a week than within a
  day in all four corpora that can be read, and in 12 of 13 domains. On Eedi,
  that shrinking is accounted for by learners who had not passed the
  prerequisite catching up on it, a reading from one corpus, re-registered
  after its estimates were seen.

  Direction (RQ1; simulated, with real corpora placed). The orientation
  statistic is identically a sort from the easier skill to the harder, so it
  is right only as far as difficulty rises along the true edges. In a
  simulated world where a skill needs any one of its prerequisites rather than
  all of them, and later skills are easier than earlier ones, it points most
  edges the wrong way. On the real corpora that could be placed, difficulty
  rises only weakly with depth: on ASSISTments, with grade as assigned by a
  name-matching rule that no person checked, the skill from the higher Common
  Core grade was harder in 0.576 [0.503, 0.647] of pairs, and the dependent
  was harder along 0.579 of Junyi's authored edges, a sign established by a
  floor that failed on power. An estimator that uses variation in the order in
  which learners met the skills is not tied to difficulty when that order is
  assigned at random, but in simulation it was fooled when abler learners
  chose the order, even after an adjustment for ability.

  Reliability (RQ2). The same kind of data does not give the same edges twice
  to the standard this work set. The split-half reliability of the ranking of
  pairs reached 0.643 on XES3G5M, at most 0.743 on its 90 best-covered skills,
  and 0.136 on EdNet, against a bar of 0.80. Agreement on which pairs to
  assert rose with the number of learners, but on XES3G5M it levels off at an
  excess kappa of +0.644 [+0.584, +0.722], below 0.80. Where reliability is
  high, as for course order on MOOCCubeX, it is nearly as high on deranged
  data and measures the curriculum. Repeatability also does not certify edges:
  in a simulated world shaped like XES3G5M a ranking exceeded 0.80 while 0.075
  of its asserted edges were true, and across 20 such worlds the adopted
  rule's precision stayed between 0.074 and 0.095 from 500 to 32,000
  learners. Stability selection gave a precision of 0.956 at a sensitivity of
  0.150 in those worlds; on real data it selected 10 of 32,362 candidate pairs
  on XES3G5M and none on EdNet.

  Validity (RQ3). No independent order confirmed the edges derived from
  learner records, and none contradicted them, so their validity is untested
  rather than shown or refuted. Common Core grade order, as assigned to
  ASSISTments skills by a name-matching rule that no person checked, was NOT
  RECOVERED: the excess over a deranged control was +0.0117 [+0.0054,
  +0.0181], positive but below the registered bar of 0.02, and it came only
  through the approximately matched skills (exact names alone gave -0.0022
  [-0.0099, +0.0094]). On EDM Cup the same test was unanswerable or
  underpowered. On Junyi, crowdsourced ratings of prerequisite strength
  correlated with the learner order effect at +0.299 [-0.017, +0.571], not
  shown to differ from zero, and the ratings mostly follow how close two
  skills sit in the taxonomy (-0.740). Randomized trials show that order can
  matter, by +0.317 logits in the one trajectory-order trial with deposited
  data, but none randomized the order of two skills whose edge the records had
  decided.

  Usefulness (RQ4). On XES3G5M, edges that language models built from
  question text raised the area under the curve (AUC) for held-out learners'
  next attempts by +0.000161 [+0.000115, +0.000207] over the same nodes
  without edges, and by +0.000151 [+0.000107, +0.000196] over the same edge
  list joining skills assigned at random. Both fall below the pre-registered
  bar, so the verdict is EDGES ADD NOTHING, from an instrument that detected
  every planted prerequisite effect. The dataset's own expert tree was
  equivalent to deranged trees of the same shape within the pre-registered
  margin of 0.001, +0.000037 [+0.000010, +0.000063], and the verdict is TREE
  EQUIVALENT TO ITS DERANGEMENT. What predicted was the nodes: the built nodes
  beat the expert taxonomy by +0.002405, mostly because each question was
  tagged with every skill it draws on. In the dataset authors' deep
  knowledge-tracing models (simpleKT and AKT) the route control's detection
  floor failed, so the verdict there is UNANSWERABLE.

  What is identified (RQ5). On XES3G5M, the gap matrix the atlas reads holds a
  pairwise residual beyond the effects of single skills that replicates
  between halves of the learners at +0.318, part of it antisymmetric; on EdNet
  the residual is small, +0.022. Item tree analysis's implication count sees
  no dependency on MOOCCubeX and could not have seen one: on dense XES3G5M
  sets, a single planted prerequisite moved it in 0.07 of placements, a
  conjunctive gate in 0.27 and a chain in 0.20, against a pass mark of 80%, so
  the registered verdict is UNANSWERABLE and its null, MOOCCubeX's included,
  is not evidence of absence. A pair-level test against a fitted one-trait
  model, whose floor passed, finds pairwise local dependence beyond one trait
  in 8 of 15 XES3G5M sets, on 12 pairs that sit close together in the expert
  taxonomy; it cannot orient a pair or tell a prerequisite from a trait two
  skills share. Across four national curricula, part of the dependence
  carries from one country's platform to another's, b_other +0.125 [+0.091,
  +0.158], and a larger part follows local teaching, b_prox +0.363 [+0.326,
  +0.401]. That result rests on a map of units to Common Core clusters coded
  by a model and checked by one person at a kappa of 0.606 [0.493, 0.709], and
  it cannot separate a cognitive core from a culture of mathematics education
  the four countries share.

  Testing an edge. A release trial that randomizes learners needs 291 to 385
  per arm to detect the drop of 0.10 in accuracy the atlas tests for, and
  about 1,570 to detect 0.10 standard deviations; randomizing encounters needs
  fewer learners and randomizing classes more (the article's Table 16). Until
  such trials are run, the case for any particular edge rests on instructional
  judgment, not on records in which too few learners met the skill without it
  to test the claim.

limitations:
  - >-
    NO RESULT HERE COMES FROM OUR OWN PLATFORM. The results on existence, lag,
    reliability, validity, usefulness and what is identified (RQ1 to RQ5) rest
    on archival learner records and three randomized trials collected by
    others. The orientation sweep, the error curve of the adopted rule, the
    stability-selection bound, the kappa-bar world and the order-variation
    estimator are simulated, and hold for the worlds simulated, whose
    mechanisms, difficulty regimes and densities the program chose. Learning
    telemetry on our platform is collected under terms that prohibit research
    publication. A randomized study in a course whose graph we control is
    specified (platform/irb/PROTOCOL-DRAFT.md) and will be reported separately.
  - >-
    THE ATLAS READS ONE OUTCOME AGAINST ONE CLAIMED EFFECT. A prerequisite is
    operationalized as a drop of 0.10 in first-attempt accuracy on the
    dependent skill, fixed in the program's shared code and not estimated from
    any corpus. A prerequisite whose effect is smaller, or that acts on later
    attempts, on speed or on retention, would leave its pairs unknown, not
    contradicted. A first attempt on the record is also not necessarily a
    learner's first encounter with a skill, and Duolingo SLAM releases only
    each learner's first 30 days.
  - >-
    THE POSITIVITY ESTIMAND READS FIRST-ATTEMPT ACCURACY AT AN UNCONTROLLED
    LAG. It shrinks with lag wherever that can be tested, and the bands hold
    different learners, so atlas verdicts pool bands whose effects differ, and
    the decay shows that the estimand moves with lag, not that any edge
    weakens. Eedi keeps only each pupil's latest answer, so its order and
    first-attempt outcomes are read from last answers.
  - >-
    NEGATIVE EXISTENCE VERDICTS ARE STATED UNDER A CONVENTION THIS RELEASE
    PROPOSES. A pair is CONTRADICTED only if a merge node on it (a node reached
    after both, with enough learners in each passed/failed stratum and enough
    power to show a conjunctive gate) is observed, readable and powered. The
    rule is stricter than power alone and is not derived from an external
    standard. Its rationale is that two capabilities can be unrelated pairwise
    and still fuse downstream, and pairwise drops do attenuate planted
    conjunctive gates. A weaker rule, counting any powered pairwise null as
    CONTRADICTED, would decide all 1,399 powered pairwise nulls across the
    atlas file's corpora, of which this rule returns 1,183 to unknown, and
    loses that protection. Whether the trade is worth making is a question for
    causal-inference review, which remains requested.
  - >-
    THE ABILITY ADJUSTMENT IS PARTIAL, AND A DERANGED ARM REMOVES ABILITY
    TOGETHER WITH ANY DEPENDENCE. The check on supported verdicts subtracts a
    learner's mean first-attempt correctness on other skills, which measures
    ability with error and also carries any real dependence of those skills on
    a or b, so its survival shares estimate rather than count. Most readings
    are an excess over a family-matched derangement, which also removes the
    confounding by general ability, so an excess shows that a signal runs
    through individual learners, not that it is prerequisite structure.
  - >-
    HOW FAR DIFFICULTY RISES ALONG REAL EDGES, AND WHICH MECHANISM REAL
    PREREQUISITES RUN ON, IS NOT KNOWN BY DOMAIN, and together they decide how
    often the orientation statistic, a difficulty sort, is right. On
    ASSISTments the placement rests on an unchecked name-matching map, and on
    Junyi on a floor that failed on power. Conjunctive structure is sparse
    (above-bar share 0.108 [0.062, 0.170] on XES3G5M, 0.054 [0.022, 0.096] on
    EdNet), and the drop shrinks with lag in 12 of 13 domains, with no corpus
    showing domains differing by the pre-registered 0.03 (Eedi's spread is
    0.025). Construction-heavy and procedural domains are untested.
  - >-
    SEVERAL CONSTRUCTS WERE CODED BY A MODEL OR A RULE SET, AND THE ONE HUMAN
    REFERENCE IS A SINGLE PERSON. The map from units to Common Core clusters on
    which the cross-curricular result rests met its registered bar against one
    coder, the author, at a kappa of 0.606 [0.493, 0.709]: it passed by 0.006,
    and reading the 13 blank items as no cluster, a reading not registered,
    gives 0.549. No second person has coded the sample. The Common Core grade
    of each ASSISTments skill was assigned by a rule set that no person
    checked, so the directional test of RQ3 and the ASSISTments placement of
    RQ1 rest on an unvalidated reference. MOOCCubeX's concepts were extracted
    by a model, so the concept-level item tree analysis is descriptive. The
    built graph's nodes, edges and tags were checked by no person, by design.
  - >-
    ITEM-TREE RESULTS ARE NARROWER THAN THEY LOOK. The MOOCCubeX null (1 of 20
    item sets beyond a null that holds both ability and difficulty fixed) is
    not evidence of absence: the implication count failed its floor on dense
    XES3G5M sets (0.07, 0.27 and 0.20 of placements against 80%), and the
    fixed-margins null is exact only under a Rasch model. The concept-level
    result (9 of 11 sets surviving the first null, 0 of 11 the second) rests on
    model-extracted concepts. On ASSISTments, read over all 29,018 learners,
    90.3% of IITA-asserted edges fall on pairs the atlas could not decide. That
    audit's registered floor failed at 3,000 synthetic learners once the
    reachability gate was applied, so its registered verdict is withheld; a
    rerun at 10,000, made after the result and labeled post hoc, passes every
    check the reading depends on.
  - >-
    USEFULNESS WAS TESTED ON ONE CORPUS, BY ONE OUTCOME. The comparisons of
    built and expert edges with their shuffled, deranged and reversed copies
    rest on XES3G5M alone; DBE-KT22 was not used because its terms do not
    permit its question text to be sent to model providers without written
    permission. The models were additive logistic regressions and a coupled
    latent state; the dataset authors' deep models were run only on synthetic
    data, where the route control's floor failed, and architectures built to
    use direction were not run. Prediction of the next attempt is not
    learning: an edge set that does not improve the forecast could still
    improve sequencing, retention or transfer, which nothing here measured.
  - >-
    THE CORPORA ARE THOSE THEIR PROVIDERS RELEASED, AND MOST ARE MATHEMATICS.
    They are not a sample of platforms, two pairs of them come from one
    platform each (ASSISTments and EDM Cup; Junyi ds1275 and Junyi 2020), and
    in none was the order in which learners met skills randomized. Every
    analysis of validity and usefulness rests on mathematics. The
    cross-curricular comparison reads one platform from each of four
    countries, two in each language, so part of what carries across curricula
    may be shared language (a within-language excess up to +0.055 could not be
    ruled out), and a platform is not a national curriculum.
  - >-
    SOME ANALYSES WERE NOT PRE-SPECIFIED, AND THE ANALYST WAS NOT BLIND. The
    positivity atlas itself, the item tree analysis of MOOCCubeX, the
    comparison of surmise relations with the atlas, the reanalysis of the
    trajectory-order trial and the mastery-release contrast are among the
    analyses recorded as not pre-specified. The second lag-forgetting study was
    registered after the first study's estimates had been seen and is not an
    independent replication. Each later registration was written by someone
    who knew earlier results on the same corpora, and every detection floor
    was written by the program that wrote the instrument it checks; where one
    script defines and scores its floor, the floor is a smoke check of the
    code. Readings outside the three randomized trials are observational.
  - >-
    FAULTS IN READING THE DATA WERE FOUND, AND OTHERS MAY REMAIN. Three readers
    were corrected (the EDM Cup mirror's placeholder times, a DataShop reader
    that took the first file in sorted order, an atlas sampler that shared one
    random stream across corpora), and a scorer that read the logged statement
    of each fraction problem in DataShop dataset 1190 as answers withdrew an
    estimate. The control that separates taxonomy distance from dependence in
    the Junyi ratings had 31.4% power at the observed size.
  - >-
    STATISTICAL CONCLUSIONS ARE BOUNDED BY THE UNITS RESAMPLED AND THE NUMBER
    OF VERDICTS. Intervals resample held-out learners, classes, cluster pairs,
    pairs or dependent skills, and describe only that unit's uncertainty; where
    pairs share prerequisite skills that the bootstrap does not resample, they
    may be too narrow. Some estimates, such as the decided shares of the atlas,
    carry no interval, and the four-order experiment's intervals are 90%. Many
    verdicts were registered and no correction was made across them. Several
    verdicts lie close to their bars: the cluster map passed by 0.006, and the
    ECPE chain was not rejected at a p of 0.068 with a Monte Carlo standard
    error of about 0.011. The reliability bar of 0.80 is a convention, and the
    attempt to size it was unanswerable.

ethics:
  irb:
    required: false
    determination: >-
      No intervention, no contact, no re-identification, and one of the
      populations does not exist. See the protocol's external_review block.
  data_sharing:
    permitted: false
    detail: >-
      ASSISTments, EDM Cup, XES3G5M, Eedi, DataShop, MOOCCubeX and ICPSR
      151741 may not be redistributed under the terms they are held on; the
      Junyi 2015 exercise table, authored map and ratings are held for research
      use, the ECPE grammar responses state no licence and are held under the
      strictest of these terms, and the Coherence Map is a public web tool's
      data. No derived extract leaves the analysis container. EdNet, Duolingo
      SLAM and Junyi 2020 are redistributable under their licences but are not
      redistributed here. The
      release records each corpus's location and the hash of the bytes read
      instead. Everything in this release that could be
      shared is an aggregate.

funding: >-
  No external funding. Internal work on a commercial product's research
  programme, which is its own interest and is recorded here as one rather than
  left to be inferred from the repository it sits in.

conflicts: >-
  Every author is a party to the product whose pipeline this evaluates. The
  release reports mixed results about that pipeline (built nodes improved
  prediction; built edges added nothing that cleared the pre-registered bar); the
  negative half is evidence against the obvious direction of this interest
  rather than a guarantee against it. Several findings also correct earlier numbers from this same programme,
  and the originals are kept in the working record. Use of every dataset here is non-commercial: they are analysed only to produce research published openly on learning-wiki as a public good. Commercial applications may later build on those published results, as anyone's may, but no dataset, extract or model trained on one is used commercially (maintainer, 2026-09-25).

