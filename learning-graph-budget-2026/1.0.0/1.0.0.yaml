  # ---------------------------------------------------------------------------
  # PAPER II (research/article/what-learner-records-can-say-about-a-prerequisite-edge.md).
  # Declared 2026-10-08 for every study the article cites that the entries above
  # did not cover, by research question. Every invocation is run from the study
