  # ---- RQ1: existence and direction (Section 5.1) ----------------------------

  - id: qmatrix-positivity
    title: >-
      Whether the item design (the Q-matrix) or the order in which learners met
      the skills is what leaves the atlas's edges undecided: for every edge the
      atlas scores on XES3G5M, ASSISTments 2012-13 and Eedi, whether any item
      measures B without A, crossed with the edge's atlas state (Gu and Xu's
      condition)
    # Docstring pre-registration committed at cbc0f5d; the real run and the
    # result followed at bb16a60. CHANGES entries ba778db and 435417b changed
    # only timestamp ordering, before any number was read.
    prespecified: true
    code:
      repo: "https://github.com/Learning-Design-Alliance/Learning-engineering-research"
      path: studies/identifiability/qmatrix-positivity/qmatrix_positivity.py
      commit: bb16a607ecaa55b11470a81813d2ae5b8c700088
    environment:
      language: python
      version: "3.11"
      detail: >-
