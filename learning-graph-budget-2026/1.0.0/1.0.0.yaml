# (private; github.com/Learning-Design-Alliance/Learning-engineering-research).
#
# `released_at` is the date this was written up, not the date it became public,
# because it has not. The embargo is our decision about commercial and patent
# exposure; the protocol this names permits publication. Those are different
# things, recorded separately, and nothing in this file changes when the
# embargo lifts.
#
# NOTHING HAS BEEN RELEASED, so 1.0.0 is corrected in place. On 2026-10-14
# (maintainer's decision; scope audit 2026-10-14, Z7) it was corrected to
# describe Paper II only, the article
# research/article/what-learner-records-can-say-about-a-prerequisite-edge.md,
# which replaces the earlier Paper 1 drafts: the title, question, design,
# interpretation and limitations are restated from the article, and the
# analyses, datasets, artifacts and evidence that only Paper 1 used are removed.
# Each analysis that remains declares the commit and exact invocation that
# produced its published output; later changes to any of them are recorded in
# the release's corrections files (readiness records). This includes the split of each analysis that called a model into a
# `-model-calls` analysis (the authored content sent) and one that reads the
# learner records with no model call.
#
# THIS RELEASE IS MOSTLY REAL LEARNER RECORDS, WITH SOME SIMULATION, and says
# which in every claim. The results on existence, reliability, validity,
# usefulness and what is identified rest on archival learner records and three
# randomized trials collected by others; the orientation sweep, the error curve
# of the adopted rule, the stability-selection bound, the kappa-bar world and
# the order-variation estimator are simulated.
# ============================================================================

schema_version: 1

release:
  id: learning-graph-budget-2026
  version: 1.0.0
  title: >-
    What learner records can say about a prerequisite edge
  released_at: 2026-09-25
  # The QUESTION, not the finding.
  question: >-
    What can learner records say about a prerequisite edge: do they contain the
    contrast that identifies one (learners who met the dependent skill without
    the prerequisite), and when they do, can they tell which way it points; do
    the same kind of data give the same edges twice; do edges derived from
    learner records agree with an independent order; do prerequisite edges,
    whether built by language models or authored by experts, improve the
    prediction of learners' next attempts; and, if edges are not identified,
    what dependence between skills is?

protocol:
  ref: learning-graph-structure
  version: 1.0.0

no_study_reason: >-
  No study plan object was written for this investigation. It began as adaptive
  simulation and secondary analysis inside a product research programme, and a
  plan written now would post-date its own findings. The later analyses stated
  their verdict rules in code committed before they ran; each analysis records
  which in `prespecified`. The randomised follow-up that would answer the open
  questions has its own draft protocol (platform/irb/PROTOCOL-DRAFT.md) and is
  not this release.

research_design:
  family: other
  detail: >-
    SECONDARY ANALYSIS OF ARCHIVAL LEARNER RECORDS, SUPPORTED BY SIMULATION.
    No learner was recruited, contacted or assigned to a condition, and no new
    data were collected. (1) THE POSITIVITY ATLAS. The corpora are practice
    platforms, intelligent tutors, a language-learning application, a
    test-preparation application and online courses: XES3G5M, ASSISTments
    2012-13, EDM Cup 2023, EdNet KT1, Eedi, Duolingo SLAM 2018, Junyi (DataShop
    dataset 1275), seven other DataShop datasets, Junyi 2020 and MOOCCubeX. For
    every ordered pair of units (or a seeded sample of 20,000; 40,000 on
    ASSISTments) the atlas compares the identifying cell, learners who met b
    after attempting a without passing it, with the mastered cell, learners who
    met b after passing a, on first-attempt accuracy on b. Each pair is
    supported, contradicted or unknown against a claimed drop of 0.10, and a
    powered null counts as contradicted only if a readable and powered merge
    node passes the reachability gate. A registered study follows every pair
    through the conditions at which it can fail to be decided, splits empty
    identifying cells into coverage, order, ease and retry by an identity, and
    checks supported verdicts against general ability. (2) STUDIES BY RESEARCH
    QUESTION. Existence and direction: the drop by lag band and by domain, the
    items' Q-matrices, shared items, conjunctive gates, the mastery-release
    contrast inside ASSISTments' skill builders, and an orientation sweep in
    simulation with real corpora placed on difficulty against depth.
    Reliability: split-half reliability and agreement of the pairs a rule
    asserts on XES3G5M and EdNet, against learner-deranged controls, with
    stability selection and course order on MOOCCubeX. Validity: directional
    tests against Common Core grade order on ASSISTments and EDM Cup,
    crowdsourced Junyi prerequisite ratings, and three randomized experiments
    on order (the kindergarten length-measurement trial of Sarama et al. 2021,
    ASSISTments experiment PSABANRN, and an order swap in DataShop dataset
    1190). Usefulness: on XES3G5M, a graph that language models built from
    question text alone, frozen before any learner response was read, and the
    dataset's expert KC-route tree, each compared with shuffled, deranged and
    reversed copies by the area under the curve for held-out learners' next
    attempts against a pre-registered bar. What is identified: tests of
    pairwise local dependence beyond a one-trait model, a positive control on
    the ECPE grammar data, and a cross-curricular comparison of one platform
    each from China, the United States, the United Kingdom and Taiwan on a
    model-coded map of units to Common Core clusters. (3) INSTRUMENT CHECKS.
    With two exceptions, every instrument that returns a verdict was first run
    on synthetic learners shaped like the records it reads, under a pass rule
    written before the floor ran; most readings are reported as an excess over
    a family-matched derangement; permutation and resampling act on the unit
    that was assigned; every verdict is signed. Simulation also supplies the
    orientation sweep, the error curve of the adopted rule, the
    stability-selection bound, the kappa-bar world and the order-variation
    estimator.
  preregistration:
    registered: false
    note: >-
      Not registered with any external registry. Each study's pre-registration
      is the docstring at the top of its script, committed before the script
      read any real data: the question, estimand, thresholds, verdict strings,
      detection floor with its pass rule, and controls. A CHANGES entry in the
      same docstring records every amendment and when it was made. Readings
      added after a result had been seen are labeled post hoc and carry no
      registered verdict, and the second lag-forgetting study, registered after
      the first study's estimates had been seen, is disclosed as such. The
      program's earliest analyses had no registration, among them the
      positivity atlas, the item tree analysis of MOOCCubeX, the comparison of
      surmise relations with the atlas, the reanalysis of the trajectory-order
      trial and the mastery-release contrast. Each analysis below says whether
      it was pre-specified in `prespecified`.

