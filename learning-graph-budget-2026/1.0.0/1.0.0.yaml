analyses:
  - id: positivity-atlas
    title: >-
      For every ordered capability pair in each corpus, how many learners met B
      having failed A, and whether the drop in B accuracy is SUPPORTED,
      CONTRADICTED (only with an observed, readable, powered merge node) or
      UNKNOWN, over the five corpora above, Duolingo SLAM's three courses
      (slam_atlas.py) and fourteen DataShop exports, six of them too small to
      read
    prespecified: false
    code:
      repo: "https://github.com/Learning-Design-Alliance/Learning-engineering-research"
      path: studies/identifiability/overlap/atlas.py
      commit: dcb4b9c43d4194d46b8890cfb4e9eb7a264ce950
    environment:
      language: python
      version: "3.11"
      detail: >-
        Standard library plus numpy; the verdict rule is shared/edge_state.py
        and the reachability gate shared/reachability.py. Run from
        studies/identifiability/overlap/: `python3 atlas.py --out
        out/atlas.json` (every corpus but SLAM); `python3 positivity.py assist
        --pairs all --out out/positivity-assist.json` (the ASSISTments row:
        29,018 learners, 40,000 sampled pairs); `python3 slam_atlas.py` (the
        three SLAM courses through the same audit(), out/atlas-slam.json; reads
        $SLAM_DIR); and `python3 random_order.py` (the random-order split,
        out/random_order.json; reads $ASSIST_DIR/assist2012.zip). The article's
        Table 1 reads these three files. Environment variables: EDMCUP_DIR, EDNET_ZIP,
        EDNET_CONTENTS, XES_DIR, EEDI_ZIP, EEDI_ANSWERS, ASSIST_DIR,
        DATASHOP_DIR, DS1275_DIR, DS576_DIR, SLAM_DIR. Corpus locations come
        from shared/paths.data_path: each corpus's environment variable
        (documented with its default in data/data-sources.json), else the same
        layout under $LDA_SCRATCH_DIR. For each
        DataShop set the atlas reads the 'All Data' student-step export
        (shared.corpus.datashop_export) and the first KC model in it, and skips
        QA-server exports. A full run writes every row of the committed
        out/atlas.json unchanged, in discovery order; the committed file lists
        them in the order `--only` reruns merged them. Before 9ac9e38 it took the first export in sorted
        order, which read subsets for ds1190 and ds1275. No pinned lockfile.
    inputs:
      - assistments-2012
      - edmcup-2023
      - ednet-kt1
      - xes3g5m
      - eedi-2020
      - duolingo-slam-2018-en-es
      - duolingo-slam-2018-es-en
      - duolingo-slam-2018-fr-en
      - datashop-ds580
      - datashop-ds671
      - datashop-ds649
      - datashop-ds669
      - datashop-ds1190-all-data
      - datashop-ds1275-all-data
      - datashop-ds1530
      - datashop-ds1531
      - datashop-ds1706
      - datashop-ds495
      - datashop-ds576
    ai_processing: false

