analyses:
  - id: grader-boolean-rubrics
    title: >-
      Likert rubric against a model-written yes/no checklist, two models x two calls, on Mohler and
      Menagerie, with planted false and key-terms sentences against length-matched neutral ones
    prespecified: true
    code:
      repo: "https://github.com/Learning-Design-Alliance/Learning-engineering-research"
      commit: be685db0bf723a516a92989f2298cea973041891
      path: studies/measurement/grader-boolean-rubrics/boolean.py
      # The same file ships in this release's code package as code/studies/measurement/grader-boolean-rubrics/boolean.py.
      invocation: >-
        cd code && python3 studies/measurement/grader-boolean-rubrics/boolean.py --analyse
        --cases ../per-case-model-outputs.jsonl
    note: >-
      The model calls (--build, --perturb, --run) read mohler-answers, menagerie-grades and
      menagerie-programs and call gpt-5.5 (checklists, perturbations), gemini-3.1-pro-preview
      (manipulation check), gemini-3.5-flash-lite and gpt-5.4-mini (grading); they cannot be re-sent
      from the release. Pre-registered at 758e58f; instruments frozen at c5b8ed3.
    environment:
      kind: process
      detail: >-
        Python 3.11 or later with numpy. `--analyse` runs from the per-case file alone (no model call);
        checked on Python 3.13 by the reproduction (reproduction-4.md). The model calls that produced the
        per-case file (--build, --perturb, --run) used the providers' hosted APIs: OpenAI gpt-5.5 and
        gpt-5.4-mini (reasoning effort low), Google gemini-3.5-flash-lite (default sampling) and
        gemini-3.1-pro-preview.
    inputs: [per-case-model-outputs]
    ai_processing: true

  - id: grader-boolean-rubrics-floor
    title: The registered study's detection floor (revision 1; revision 0 kept as floor-rev0.json)
    prespecified: true
    code:
      repo: "https://github.com/Learning-Design-Alliance/Learning-engineering-research"
      commit: be685db0bf723a516a92989f2298cea973041891
      path: studies/measurement/grader-boolean-rubrics/boolean.py
      # The same file ships in this release's code package as code/studies/measurement/grader-boolean-rubrics/boolean.py.
      invocation: >-
        cd code && python3 studies/measurement/grader-boolean-rubrics/boolean.py --floor
        --cases ../per-case-model-outputs.jsonl
    note: Reads only human scores, draws and clusters; its `seconds` field is a runtime.
    environment:
      kind: process
      detail: >-
        Python 3.11 or later with numpy, run from the per-case file alone (no model call). Checked on
        Python 3.13 by the reproduction (reproduction-4.md).
    inputs: [per-case-model-outputs]
    ai_processing: false

  - id: grader-checklist-defects
