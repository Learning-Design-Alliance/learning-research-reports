# Release record for the checklist paper (research/article/precise-checklists-and-an-ai-grader.md).
# First complete draft (2026-10-28). Nothing has been released, so this file stays at 1.0.0 and is
# corrected in place until its DOI is published.
#
# Per-case outputs: per-case-model-outputs.jsonl beside this file, written by
# `python3 boolean.py --strip` in studies/measurement/grader-boolean-rubrics/ (ids, human scores, draw
# membership, checklist and perturbation flags, every grading's scores and per-check YES/NO; no answer,
# program, checklist, perturbation or prompt text). `--analyse` and `--floor` run from it alone and
# reproduce out/results.json and out/floor.json (the floor's `seconds` field aside).
#
# Protocol note for the maintainer: the governing protocol is open-graded-short-answer-corpora 1.0.0
# (published with ai-grader-reliability-2026, so not edited here). This study reads Mohler E01-E10
# (1,721 rows; drops E11-E12, whose per-rater scores are on 0-10) rather than the protocol's
# consistency filter (546 rows dropped). It also sends Mohler questions, reference answers and student
# answers to OpenAI (gpt-5.5, checklist and perturbation authoring; gpt-5.4-mini, grading) and Google
# (gemini-3.5-flash-lite, grading; gemini-3.1-pro-preview, manipulation check), and Menagerie programs
# to both graders. Menagerie grades are not sent. Whether this needs a protocol deviation or a new
# version is the maintainer's decision.
schema_version: 1

release:
  id: checklist-grading-2026
  version: 1.0.0
  # The lift date. Set when the release was readied for lifting (2026-11-06); correct it in place if
  # the lift happens on another day, before the DOI is published.
  released_at: 2026-11-06
  title: >-
    Precise yes/no checklists and an AI grader: reliability, validity, and what a
    checklist cannot see
  # The QUESTION, not the finding.
  question: >-
    When an LLM grader scores student work against a checklist of precise yes/no
    checks written from the same criterion, instead of a Likert rubric, are its
    scores more reliable, do they track human raters as well, and does the
    checklist register an error or reward key terms that the Likert score would
    not?

no_study_reason: >-
  No separate study plan object was written. The plan is the registration in the docstring of the
  analysis script (code/studies/measurement/grader-boolean-rubrics/boolean.py), committed before any
  model call, and the follow-up's registration in defects.py, committed before any of its own
  estimates; `prespecified` on each analysis says which is which.

protocol:
  ref: open-graded-short-answer-corpora
  version: 1.0.0

research_design:
  family: other
  detail: >-
    Repeated-measures comparison over archival human-graded student work. Every
    sampled item is graded by two LLM graders in two formats (Likert rubric;
    model-written yes/no checklist), twice each, on identical inputs, so each
    item is its own control. A planted-defect arm appends, to the same answer, a
    false sentence or a key-term sentence and, separately, a length-matched
    neutral sentence. Pre-registered with a detection floor on synthetic graders
    shaped like the data; intervals resample questions (Mohler) or submissions
    (Menagerie).
  preregistration:
    registered: true
    note: >-
      The study's design, thresholds, predictions and verdict strings were
      committed before any model call; the instruments (checklists, perturbations)
      were frozen and committed before any grading call. Recorded in the docstring
      of studies/measurement/grader-boolean-rubrics/boolean.py.

