evidence:
  # Drafted 2026-11-06 for the maintainer's review: which results the wiki carries is the maintainer's
  # decision. Each ref is <observation record>/<observation id> in observations/lazuli-grader-checklist-2026.yaml.
  - ref: lazuli-grader-checklist-2026/retest-short-answers
    note: >-
      Near-ceiling repeatability in both formats; the checklist's 0.011 shortfall is inside the margin
      and within what its coarser scale alone produces.
  - ref: lazuli-grader-checklist-2026/cross-model-short-answers
    note: Too uncertain to call.
  - ref: lazuli-grader-checklist-2026/reliability-programs
    note: Every clear difference on programs favored the Likert format.
  - ref: lazuli-grader-checklist-2026/human-agreement-short-answers
    note: The checklist agreed less with the human raters, for both models.
  - ref: lazuli-grader-checklist-2026/under-credit-partly-correct
    note: Where the formats part; consistent with, not a decomposition of, the lower correlation.
  - ref: lazuli-grader-checklist-2026/false-sentence-contrast
    note: The checklist registered a false claim about a third as much as the Likert format.
  - ref: lazuli-grader-checklist-2026/key-terms-contrast
    note: Clear pooled and for Gemini only.
  - ref: lazuli-grader-checklist-2026/error-checks-share
    note: What the checklist registered of a false claim came mainly from checks written to look for errors.
  - ref: lazuli-grader-checklist-2026/human-agreement-programs
    note: Uninformative about the formats; the models barely tracked the raters on programs.

interpretation: >-
  For two LLM graders of student work, a model-written checklist of precise yes/no checks was not
  shown to make scores more reliable than a Likert rubric written from the same criterion: in the
  short-answer assessments both formats gave nearly the same scores on a second grading (test-retest r
  0.96-0.99; the checklist 0.011 lower, clear by the registered rule and inside the 0.03 margin), and in
  the assessments of software programs the Likert format was more reliable wherever the data clearly showed a difference. In
  the short-answer assessments the checklist agreed less with two human raters (dH -0.106 [-0.165, -0.048]), at
  near-equal test-retest reliability; it under-credited answers the raters judged partly or fully
  correct, and was not shown to over-credit wrong ones. A checklist written from a reference answer
  mostly checked presence, not truth: an appended false sentence lowered it by 0.172 of its scale against
  0.473 for Likert, mostly through checks written to look for errors, and key terms without
  understanding raised it more (+0.348 against +0.273, clear pooled and for Gemini), entirely
  through presence checks. In the assessments of software programs the models tracked the raters weakly or not at all on three
  of four dimensions, so the format comparison there is not informative.

limitations:
  - Two small models; the checklists, the planted sentences and the manipulation check were each made by one model, with no human review.
  - One short-answer corpus from one course; human raters using either format were not tested, so nothing here bears on checklists for human graders.
  - Error checks (the registration's avoid checks) are identified by a word rule over checklist text the release does not publish.
  - On programs the models tracked the raters weakly or not at all on most dimensions, the coursework specification was not shown, and 46 submissions were dropped for unparseable calls (45 of them for miscounted checklist answers).
  - The detection floors were written and scored by the same session that ran the study.

